<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ถ่ายโอนสู่ผลึก</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one mine shaft — dark crown band with a turning rock-salt lattice, then six strata (3.2.1–3.2.5) descending; a sticky level bar on top */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface2:#e2e7eb; --ink:#18212a; --muted:#56636f; --line:#c8d0d8;
  --cat:#b5600b; --an:#0c7a6e; --accent:#ad2f5a; --onAccent:#ffffff;
  --good:#2b7d39; --bad:#bd3a2b; --endo:#c2432b; --exo:#2465ad; --gold:#c99a1c;
  --band:#16212c; --bandInk:#e9eef3; --bandMuted:#a2b2c1;
  --f-disp:"Chakra Petch","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun","Leelawadee UI","Thonburi",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#18212a; --surface2:#212c37; --ink:#e5eaef; --muted:#9caab7; --line:#33414f;
  --cat:#f0a43e; --an:#3fc3b1; --accent:#e5668f; --onAccent:#22070f;
  --good:#5cc46c; --bad:#f06b5b; --endo:#f17b5d; --exo:#6aa7ee; --gold:#e8be4a;
  --band:#0a0f14; --bandInk:#e9eef3; --bandMuted:#94a5b5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#18212a; --surface2:#212c37; --ink:#e5eaef; --muted:#9caab7; --line:#33414f;
  --cat:#f0a43e; --an:#3fc3b1; --accent:#e5668f; --onAccent:#22070f;
  --good:#5cc46c; --bad:#f06b5b; --endo:#f17b5d; --exo:#6aa7ee; --gold:#e8be4a;
  --band:#0a0f14; --bandInk:#e9eef3; --bandMuted:#94a5b5; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
sub,sup{font-size:.68em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-size:.78em;color:var(--muted);font-weight:500;letter-spacing:.01em}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.25}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}

/* level bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--bandInk);border-bottom:1px solid #000}
.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid #2c3b49;background:#1d2a36;color:var(--bandInk);border-radius:6px;padding:4px 10px;min-width:86px;line-height:1.25}
.chip b{font:600 .78rem var(--f-disp);color:var(--bandMuted)}
.chip span{font-size:.84rem;white-space:nowrap}
.chip i{font-style:normal;font-size:.72rem;color:#e8be4a;letter-spacing:1px;min-height:1em}
.chip.on{background:#f4e9ec;color:#16212c;border-color:#f4e9ec}
.chip.on b{color:#ad2f5a}
.chip.done{border-color:#3fc3b1}
.chip.home{justify-content:center;min-width:auto}

/* hero */
.hero{background:var(--band);color:var(--bandInk);position:relative;overflow:hidden}
.hero canvas{position:absolute;right:-30px;top:-10px;width:300px;height:300px;opacity:.9;pointer-events:none;--cat:#f0a43e;--an:#3fc3b1;--line:#3a4b5b;--accent:#e5668f}
.hero .wrap{position:relative;padding-block:34px 30px}
.eyebrow{font:600 .8rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--bandMuted)}
.hero h1{font-size:clamp(2.1rem,7vw,3.3rem);font-weight:700;margin-top:6px;max-width:14ch}
.hero h1 small{display:block;font-size:.42em;font-weight:500;letter-spacing:.08em;color:#e5668f;margin-top:4px}
.hero p{max-width:46ch;color:#cfd9e2;margin:14px 0 0}
@media (max-width:560px){.hero canvas{opacity:.35;right:-90px}}

.section{padding-block:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 220px}
.field label{font-size:.88rem;color:var(--muted)}
input[type=text]{font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:.6rem 1.05rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.3;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.35rem .7rem;font-size:.92rem}

.meter{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--an),var(--cat));border-radius:5px}

/* strata */
.strata{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin-left:6px}
.stratum{position:relative;padding:14px 0 14px 22px}
.stratum::before{content:"";position:absolute;left:-9px;top:24px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.stratum.done::before{background:var(--an);border-color:var(--an)}
.stratum .card{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stratum .card>div{min-width:0}
.depth{font:600 .76rem var(--f-disp);color:var(--muted);letter-spacing:.06em}
.stratum h3{font-size:1.18rem;margin-top:2px}
.stratum .place{color:var(--muted);font-size:.93rem}
.stars{color:var(--gold);letter-spacing:2px;font-size:.95rem}
.stars .off{color:var(--line)}
@media (max-width:520px){.stratum .card{grid-template-columns:1fr}}

.foot{padding-block:24px 40px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);margin-top:10px}

/* station */
.st-head{padding-block:20px 6px}
.st-head .code{font:600 .82rem var(--f-disp);color:var(--accent);letter-spacing:.1em}
.st-head h2{font-size:clamp(1.5rem,5vw,2rem)}
.pips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.pip{font-size:.8rem;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.pip.on{background:var(--ink);color:var(--bg)}
.pip.ok{background:color-mix(in srgb,var(--an) 20%,var(--surface));color:var(--ink)}
.stepTitle{font-size:1.25rem;margin:14px 0 4px}
.stepLead{color:var(--muted);margin:0 0 12px;max-width:62ch}
.nav{display:flex;justify-content:flex-end;gap:10px;padding-block:18px 40px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lcard h3{font-size:1.05rem;margin-bottom:6px}
.lcard p{margin:0 0 6px}
.lcard .k{font-family:var(--f-disp);font-size:1.02rem;background:var(--surface2);border-radius:6px;padding:4px 8px;display:inline-block;margin:2px 0}
.c{color:var(--cat);font-weight:700}.a{color:var(--an);font-weight:700}
table.ions{border-collapse:collapse;width:100%;font-size:.95rem}
table.ions td{border-bottom:1px solid var(--line);padding:3px 4px}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.qtext{margin:0 0 10px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:.6rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));font-weight:600}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));text-decoration:line-through;opacity:.8}
.fb{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-left:4px solid var(--good)}
.fb.no{background:color-mix(in srgb,var(--bad) 11%,var(--surface));border-left:4px solid var(--bad)}
.fb.info{background:var(--surface2);border-left:4px solid var(--muted)}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stage svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.svgt{font-family:var(--f-body);fill:var(--ink)}
.svgd{font-family:var(--f-disp);fill:var(--ink)}
.roundTag{font:600 .82rem var(--f-disp);color:var(--muted);letter-spacing:.06em}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface2);width:38px;height:36px;font-size:1.2rem}
.stepper output{min-width:38px;text-align:center;font:700 1.1rem var(--f-disp)}
.eq{font-family:var(--f-disp);font-size:1.05rem}
.big{font-family:var(--f-disp);font-size:1.6rem;font-weight:700}

/* lattice puzzle */
.grid{display:grid;gap:4px;margin:8px auto;max-width:300px}
.cell{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);background:var(--bg);font:700 .95rem var(--f-disp);display:flex;align-items:center;justify-content:center;padding:0}
.cell.p{background:var(--cat);border:2px solid var(--cat);color:#fff}
.cell.m{background:var(--an);border:2px solid var(--an);color:#fff}
.cell.fix{box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.cell.bad{outline:3px solid var(--bad);outline-offset:1px}
canvas.cr{width:100%;max-width:360px;height:280px;display:block;margin:0 auto;touch-action:none;cursor:grab}

.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.5rem .7rem;text-align:left;font-family:var(--f-disp)}
.tile.used{opacity:.35}
.seq{min-height:52px;border:2px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.seq .tile{display:flex;gap:8px;align-items:center}
.seq .tile b{color:var(--accent)}
.cls{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cls>div{min-width:0}
.tog{display:flex;gap:6px}
.tog .btn.on-ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.tog .btn.on-no{border-color:var(--bad);text-decoration:line-through}
@media (max-width:520px){.cls{grid-template-columns:1fr}}

.bulb{transition:fill .3s}
.bulb.on{fill:#ffd54a;filter:drop-shadow(0 0 10px #ffd54a)}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes drift2{from{transform:translateX(6px)}to{transform:translateX(-6px)}}
.mv1{animation:drift 1.1s ease-in-out infinite alternate}
.mv2{animation:drift2 1.3s ease-in-out infinite alternate}
.tok{display:inline-flex;align-items:center;padding:.3rem .55rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-disp);margin:3px 2px}
.tok.x{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted);background:var(--surface2)}
.tok.fixed{border-style:dashed;cursor:default}
details.rules{background:var(--surface2);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.94rem}
details.rules summary{font-weight:600;cursor:pointer}

/* result */
.result{text-align:center;padding:26px 16px}
.result .score{font:700 3.6rem var(--f-disp);line-height:1;font-variant-numeric:tabular-nums}
.result .stars{font-size:2rem}
.result .medal{font:600 1.1rem var(--f-disp);margin-top:6px}
.result p{max-width:48ch;margin:12px auto}

/* modal */
.modal{position:fixed;inset:0;z-index:30;background:rgba(8,12,16,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);color:var(--ink);border-radius:12px;max-width:720px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal img.cert{width:100%;border:1px solid var(--line);border-radius:6px}
.sig{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sig img{max-height:50px;max-width:160px;background:#fff;border:1px solid var(--line);border-radius:4px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:600;max-width:90vw;text-align:center}
.confetti{position:fixed;top:-10px;width:10px;height:10px;border-radius:50%;z-index:35;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.mv1,.mv2,.confetti{animation:none}.confetti{display:none}}
</style>

<script>
/* ===== ห้อง AR — ชุดเกมพันธะไอออนิก (กล้องหลัง ลากหมุน ถ่างนิ้วย่อขยาย เอียงเครื่อง ถ่ายภาพ AR) ===== */
(function(){
"use strict";
const RMo=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FD='"Chakra Petch","Sarabun",sans-serif',FB='"Sarabun","Leelawadee UI",sans-serif',FM='"IBM Plex Mono",ui-monospace,monospace';
const CSS=`
.iar-h{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#FFB627;color:#1E1400;border:0;border-radius:999px;padding:10px 18px 10px 14px;font:700 1rem ${FB};cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.iar-h:hover{background:#FFC85C}.iar-h small{font-weight:600;opacity:.75;font-size:.8em}
.iar-s{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--line,#c8d0d8);background:var(--surface,#fff);color:var(--ink,#18212a);border-radius:999px;padding:6px 13px 6px 10px;font:700 .9rem ${FB};cursor:pointer}
.iar-s:hover{border-color:#FFB627}
.iar-h svg,.iar-s svg{width:18px;height:18px;flex:none}
.iar-h:focus-visible,.iar-s:focus-visible,#iar button:focus-visible{outline:3px solid #FFB627;outline-offset:2px}
dialog#iar{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#06090C;color:#F2F6F9;overflow:hidden;font-family:${FB}}
dialog#iar::backdrop{background:#06090C}
#iar *{box-sizing:border-box}
#iar .ar-bg{position:absolute;inset:0;background:#141D25;background-image:radial-gradient(ellipse at 50% 60%,rgba(255,182,39,.10),transparent 60%),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}
#iarVid,#iarPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#iarCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#iar .ar-top,#iar .ar-bot{position:absolute;left:0;right:0;z-index:2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#iar .ar-top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:28px;background:linear-gradient(rgba(4,7,10,.78),rgba(4,7,10,0));display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#iar .ar-bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:34px;background:linear-gradient(rgba(4,7,10,0),rgba(4,7,10,.82));display:flex;flex-direction:column;align-items:center;gap:10px}
#iar .ar-top>*,#iar .ar-bot>*{pointer-events:auto}
#iar .ar-info{display:flex;flex-direction:column;gap:2px;min-width:0;pointer-events:none}
#iar .ar-eb{font-family:${FM};font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#FFB627}
#iar .ar-info h2{margin:0;font-family:${FD};font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700;line-height:1.1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#iar .ar-info h2 small{font-family:${FB};font-size:.5em;font-weight:500;color:#D5DEE5;margin-left:8px}
#iar .ar-meta{font-size:.92rem;color:#E6EDF2;text-shadow:0 1px 6px rgba(0,0,0,.7);max-width:60ch}
#iar .ar-meta .m{font-family:${FM};color:#FFC85C}
#iar .ar-meta .lp{display:block;font-size:.8rem;color:#C6D2DB}
#iar .ar-x{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,15,20,.55);color:#fff;font-size:1.2rem;display:grid;place-items:center;cursor:pointer}
#iar .ar-hint{margin:0;font-size:.8rem;color:#C6D2DB;text-align:center;max-width:46ch;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#iar .ar-nav{display:flex;align-items:center;gap:10px;background:rgba(10,15,20,.6);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px}
#iar .ar-nav[hidden]{display:none}
#iar .ar-nav button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem;line-height:1;cursor:pointer}
#iar .ar-nav button:disabled{opacity:.3;cursor:default}
#iar .ar-nav span{font-family:${FM};font-size:.84rem;min-width:7ch;text-align:center;font-variant-numeric:tabular-nums}
#iar .ar-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#iar .ar-b{border:1px solid rgba(255,255,255,.26);background:rgba(10,15,20,.6);color:#fff;border-radius:999px;padding:9px 14px;font:600 .88rem ${FB};display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#iar .ar-b[aria-pressed="true"]{border-color:#FFB627;color:#FFD27A}
#iar .ar-b.ar-shot{background:#FFB627;border-color:#FFB627;color:#1E1400}
#iar .ar-msg{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:rgba(13,19,24,.94);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
#iar .ar-msg[hidden],#iar .ar-sheet[hidden],#iar .ar-status[hidden]{display:none}
#iar .ar-msg h3{margin:0;font-family:${FD};font-size:1.2rem;color:#fff}
#iar .ar-msg p{margin:0;font-size:.92rem;color:#D5DEE5;line-height:1.55}
#iar .ar-msg .ar-opts{display:flex;flex-direction:column;gap:8px;margin-top:4px}

const vadd=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],vmul=(a,k)=>a.map(x=>x*k),norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};

    const ra=m.atoms[bd.a].r*unit*p.s*.7,rb=m.atoms[bd.b].r*unit*q.s*.7;

const ION={
  Na:{sym:'Na⁺',pm:102,col:'#F0A43E',txt:'#2A1600'},K:{sym:'K⁺',pm:138,col:'#E8873A',txt:'#2A1200'},Mg:{sym:'Mg²⁺',pm:72,col:'#F5C451',txt:'#2A1E00'},Ag:{sym:'Ag⁺',pm:115,col:'#C9D1D9',txt:'#1B2530'},
  Cl:{sym:'Cl⁻',pm:181,col:'#3FC3B1',txt:'#06302B'},F:{sym:'F⁻',pm:133,col:'#86D99A',txt:'#0E2E16'},O:{sym:'O²⁻',pm:140,col:'#E85A4F',txt:'#fff'}};
const EL={H:{col:'#F2F4F6',txt:'#1B2530',r:.2},N:{col:'#4C7BE8',txt:'#fff',r:.3},O:{col:'#E0453A',txt:'#fff',r:.3},C:{col:'#4F555C',txt:'#fff',r:.3},S:{col:'#E8C430',txt:'#2A2200',r:.36},P:{col:'#F08A24',txt:'#2A1400',r:.35}};

const ion=(k,p,ex)=>Object.assign({p,sym:ION[k].sym,col:ION[k].col,txt:ION[k].txt,r:ionR(k)},ex||{});

function rockSalt(c,a,o){o=o||{};const atoms=[],bonds=[],key={},n=1;
  for(let x=-n;x<=n;x++)for(let y=-n;y<=n;y++)for(let z=-n;z<=n;z++){key[[x,y,z]]=atoms.length;atoms.push(ion(((x+y+z)%2+2)%2===0?c:a,[x,y,z]))}

function ionSize(){
  const R=pm=>pm/200*.55,m={atoms:[
    {p:[-1.15,.95,0],sym:'Na',col:'#B8875A',txt:'#fff',r:R(186),lab:'186 pm'},{p:[1.15,.95,0],sym:'Cl',col:'#2E9C8C',txt:'#fff',r:R(99),lab:'99 pm'},

    [[1,0,0],[0,0,1]].forEach(d=>{const j=key[[x+d[0],y,z+d[2]]];if(j!=null)bonds.push({a:i,b:j,w:.55,col:'#8E9AA6'})});

    under(ctx,proj,unit,dpr){pl.map(p=>({p,c:proj([p.x,p.y,0])})).sort((a,b)=>a.c.z-b.c.z).forEach(({p})=>{const q=[[p.x-.3,p.y,-.3],[p.x+.3,p.y,-.3],[p.x+.3,p.y,.3],[p.x-.3,p.y,.3]].map(proj);

let box=null,lastFocus=null,curSpec=null;
(function(){if(document.getElementById('tgStyle'))return;const st=document.createElement('style');st.id='tgStyle';st.textContent=CSS;(document.head||document.documentElement).appendChild(st)})();
function ensure(){
  if(box)return box;
  box=document.createElement('div');box.id='tgBox';box.hidden=true;box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-labelledby','tgTitle');
  document.body.appendChild(box);
  box.addEventListener('click',e=>{
    if(e.target===box){close();return}
    const a=e.target.closest('[data-tgnav]');if(a){e.preventDefault();const s=box.querySelector('#'+a.dataset.tgnav);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return}
    if(e.target.closest('#tgClose'))close();

    else if(e.target.closest('#tgPrint')){box.querySelectorAll('details').forEach(d=>d.open=true);window.print()}
  });
  addEventListener('keydown',e=>{if(e.key==='Escape'&&box&&!box.hidden)close()});
  addEventListener('beforeprint',()=>{if(box&&!box.hidden)box.querySelectorAll('details').forEach(d=>d.open=true)});

}

}

<script>
"use strict";
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
let KEY,P,SET,GAME,STATIONS;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const saveP=()=>store.set(KEY+':p',P), saveS=()=>store.set(KEY+':s',SET);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fm(s){ // "Ca3(PO4)2", "SO4^2-", "Na^+(aq)"
  const k=s.indexOf('^'); let body=k<0?s:s.slice(0,k), ch=k<0?'':s.slice(k+1), rest='';
  let h=body.replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
  if(ch){const m=ch.match(/^(\d*[+\-])(.*)$/); if(m){h+='<sup>'+m[1].replace('-','−')+'</sup>';rest=m[2]}else rest=ch}
  return h+rest;
}
const eq=s=>s.split(' ').map(t=>/^[A-Za-z(½\d]/.test(t)?fm(t):t).join(' ');
const ANIMS=new Set(); const stopAnims=()=>{ANIMS.forEach(f=>f());ANIMS.clear()};
const PRAISE=[['ยอดเยี่ยม!','Excellent!'],['เก่งมาก!','Great job!'],['ถูกต้อง แม่นยำมาก','Spot on!'],['สุดยอดเลย!','Brilliant!'],['เยี่ยมไปเลย!','Nice work!'],['คิดได้ถูกต้อง!','Well reasoned!']];
const praise=()=>{const p=PRAISE[Math.random()*PRAISE.length|0];return `<b>${p[0]}</b> <span class="en">${p[1]}</span>`};
const tryPts=(max,f)=>Math.round(max*[1,.7,.5,.3][Math.min(f,3)]);
function fb(el,kind,html){el.hidden=false;el.className='fb '+kind;el.innerHTML=html}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function confetti(){if(RM)return;const cols=['var(--cat)','var(--an)','var(--accent)','var(--gold)'];for(let i=0;i<40;i++){const d=document.createElement('i');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%4];d.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
const starStr=n=>'★'.repeat(n)+`<span class="off">${'★'.repeat(3-n)}</span>`;
const medalOf=s=>s>=85?['เหรียญทอง','Gold',3]:s>=65?['เหรียญเงิน','Silver',2]:s>=40?['เหรียญทองแดง','Bronze',1]:['ผ่านการเรียนรู้','Completed',0];
function thaiDate(){try{return new Date().toLocaleDateString('th-TH-u-ca-buddhist',{day:'numeric',month:'long',year:'numeric'})}catch(e){return new Date().toLocaleDateString()}}

/* ---------- 3D rock-salt lattice ---------- */
function crystal(cv,opt={}){
  const n=opt.n||1, pts=[];
  for(let x=-n;x<=n;x++)for(let y=-n;y<=n;y++)for(let z=-n;z<=n;z++)pts.push({x,y,z,c:Math.abs(x+y+z)%2===0?1:-1});
  const bonds=[];for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j];if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)+Math.abs(a.z-b.z)===1)bonds.push([i,j])}
  const ctr=pts.findIndex(p=>!p.x&&!p.y&&!p.z), nb=new Set([ctr]);pts.forEach((p,i)=>{if(Math.abs(p.x)+Math.abs(p.y)+Math.abs(p.z)===1)nb.add(i)});
  let ax=opt.ax??-.45, ay=opt.ay??.6, hl=false, raf=0, drag=false, lx=0, ly=0, auto=!RM&&opt.auto!==false;
  const ctx=cv.getContext('2d'), D=(n+1)*6;
  function draw(){
    const w=cv.clientWidth,h=cv.clientHeight,d=devicePixelRatio||1;if(!w)return;
    if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
    ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
    const cs=getComputedStyle(cv),C={cat:cs.getPropertyValue('--cat').trim(),an:cs.getPropertyValue('--an').trim(),line:cs.getPropertyValue('--line').trim()};
    const s=Math.min(w,h)/(2*n+1.6)*(opt.scale||1),cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
    const Q=pts.map((p,i)=>{let X=p.x*cy+p.z*sy,Z=-p.x*sy+p.z*cy,Y=p.y*cx-Z*sx;Z=p.y*sx+Z*cx;const f=D/(D-Z);return{X:w/2+X*s*f,Y:h/2+Y*s*f,Z,f,p,i}});
    ctx.lineWidth=1.6;ctx.strokeStyle=C.line;
    bonds.forEach(([i,j])=>{ctx.globalAlpha=hl&&!(nb.has(i)&&nb.has(j)&&(i===ctr||j===ctr))?.18:.9;ctx.beginPath();ctx.moveTo(Q[i].X,Q[i].Y);ctx.lineTo(Q[j].X,Q[j].Y);ctx.stroke()});
    Q.slice().sort((a,b)=>a.Z-b.Z).forEach(q=>{
      const r=(q.p.c>0?.2:.3)*s*q.f, col=q.p.c>0?C.cat:C.an;
      ctx.globalAlpha=hl&&!nb.has(q.i)?.2:1;
      const g=ctx.createRadialGradient(q.X-r*.35,q.Y-r*.4,r*.1,q.X,q.Y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.28,col);g.addColorStop(1,col);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.X,q.Y,r,0,7);ctx.fill();
      if(hl&&q.i===ctr){ctx.strokeStyle='#e5668f';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1.6;ctx.strokeStyle=C.line}
      if(opt.signs&&r>7){ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(r*.9)}px "Chakra Petch",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q.p.c>0?'+':'−',q.X,q.Y+1)}
    });ctx.globalAlpha=1;
  }
  function tick(){if(auto&&!drag)ay+=.005;draw();raf=requestAnimationFrame(tick)}
  if(opt.interactive){
    cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
    cv.addEventListener('pointermove',e=>{if(!drag)return;ay+=(e.clientX-lx)*.01;ax=Math.max(-1.4,Math.min(1.4,ax+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY;if(!auto)draw()});
    cv.addEventListener('pointerup',()=>drag=false);cv.addEventListener('pointercancel',()=>drag=false);
  }
  if(auto)raf=requestAnimationFrame(tick);else requestAnimationFrame(draw);
  ANIMS.add(()=>cancelAnimationFrame(raf));
  return{setHL(v){hl=v;draw()},draw};
}

/* ---------- chemistry data ---------- */
const EL={
  Na:{th:'โซเดียม',conf:[2,8,1],m:1},K:{th:'โพแทสเซียม',conf:[2,8,8,1],m:1},Mg:{th:'แมกนีเซียม',conf:[2,8,2],m:1},
  Ca:{th:'แคลเซียม',conf:[2,8,8,2],m:1},Al:{th:'อะลูมิเนียม',conf:[2,8,3],m:1},
  Cl:{th:'คลอรีน',ion:'คลอไรด์',conf:[2,8,7]},O:{th:'ออกซิเจน',ion:'ออกไซด์',conf:[2,6]},F:{th:'ฟลูออรีน',ion:'ฟลูออไรด์',conf:[2,7]},N:{th:'ไนโตรเจน',ion:'ไนไตรด์',conf:[2,5]}
};
const val=e=>EL[e].conf[EL[e].conf.length-1];
const chg=(q,s)=>(q===1?'':q)+s;

/* ---------- 3.2.1 electron transfer ---------- */
function slotPos(cx,cy,cnt,R=40){const out=[];for(let k=0;k<cnt;k++){const side=k%4,onSide=(cnt>side?1:0)+(cnt>side+4?1:0),o=onSide===2?(k<4?-7:7):0;out.push(side===0?[cx+o,cy-R]:side===1?[cx+R,cy+o]:side===2?[cx+o,cy+R]:[cx-R,cy+o])}return out}
function actTransfer(R){return function(box,api,done){
  api.reg('tr',R.length*10);let r=0;
  function round(){
    const[m,n]=R[r],vm=val(m),need=8-val(n);let mc=1,nc=1,fails=0,solved=false,busy=false,M,N;
    const reset=()=>{M=Array.from({length:mc},()=>({left:vm}));N=Array.from({length:nc},()=>({got:0}))};reset();
    box.innerHTML=`<div class="roundTag">รอบที่ ${r+1}/${R.length} · ROUND ${r+1}</div>
    <h3 class="stepTitle">${EL[m].th} <span class="c">${m}</span> (${EL[m].conf.join(',')}) กับ ${EL[n].th} <span class="a">${n}</span> (${EL[n].conf.join(',')})</h3>
    <p class="stepLead">แตะเวเลนซ์อิเล็กตรอน<span class="c">สีส้ม</span>ของโลหะเพื่อส่งให้อโลหะ ปรับจำนวนอะตอมจนโลหะเหลือ 0 และอโลหะครบ 8 <span class="en">Tap metal electrons to transfer them. Adjust atom counts until every atom reaches a noble-gas configuration.</span></p>
    <div class="stage"><div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div class="row"><span class="c">${m}</span><span class="stepper"><button id="mMinus" aria-label="ลดโลหะ">−</button><output id="mOut">1</output><button id="mPlus" aria-label="เพิ่มโลหะ">+</button></span></div>
      <div class="row"><span class="a">${n}</span><span class="stepper"><button id="nMinus" aria-label="ลดอโลหะ">−</button><output id="nOut">1</output><button id="nPlus" aria-label="เพิ่มอโลหะ">+</button></span></div></div>
      <div id="sv"></div>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn sm quiet" id="rs">เริ่มรอบนี้ใหม่</button><button class="btn primary" id="ck">ตรวจคำตอบ <span class="en" style="color:inherit">Check</span></button></div>
    </div><div class="fb" hidden id="f"></div><div id="after"></div>`;
    const f=$('#f',box);
    const geo=()=>{const xs=c=>Array.from({length:c},(_,i)=>180+(i-(c-1)/2)*112);return{mx:xs(mc),nx:xs(nc),my:70,ny:192}};
    function draw(){
      const g=geo();let h=`<svg viewBox="0 0 360 262" role="img" aria-label="แบบจำลองการถ่ายโอนอิเล็กตรอน">`;
      M.forEach((a,i)=>{const x=g.mx[i],y=g.my;
        if(solved){h+=`<circle cx="${x}" cy="${y}" r="22" fill="var(--surface)" stroke="var(--cat)" stroke-width="3"/><text x="${x}" y="${y+6}" text-anchor="middle" class="svgd" font-size="18" font-weight="700">${m}</text><text x="${x+26}" y="${y-16}" class="svgd" font-size="15" fill="var(--cat)" style="fill:var(--cat)" font-weight="700">${chg(vm,'+')}</text><text x="${x}" y="${y+60}" text-anchor="middle" class="svgt" font-size="12">(${EL[m].conf.slice(0,-1).join(',')})</text>`}
        else{h+=`<circle cx="${x}" cy="${y}" r="26" fill="var(--surface2)" stroke="var(--cat)" stroke-width="2"/><text x="${x}" y="${y+7}" text-anchor="middle" class="svgd" font-size="20" font-weight="700">${m}</text>`;
          slotPos(x,y,a.left).forEach(([ex,ey])=>{h+=`<g class="em" data-i="${i}" style="cursor:pointer"><circle cx="${ex}" cy="${ey}" r="13" fill="transparent"/><circle cx="${ex}" cy="${ey}" r="6" fill="var(--cat)" stroke="var(--surface)" stroke-width="1.5"/></g>`});
          h+=`<text x="${x}" y="${y+62}" text-anchor="middle" class="svgt" font-size="12">(${EL[m].conf.slice(0,-1).concat(a.left).filter((v,k,ar)=>!(k===ar.length-1&&v===0&&ar.length>1)).join(',')})</text>`}
      });
      N.forEach((b,j)=>{const x=g.nx[j],y=g.ny,tot=val(n)+b.got;
        h+=`<circle cx="${x}" cy="${y}" r="26" fill="var(--surface2)" stroke="var(--an)" stroke-width="2"/><text x="${x}" y="${y+7}" text-anchor="middle" class="svgd" font-size="20" font-weight="700">${n}</text>`;
        slotPos(x,y,tot).forEach(([ex,ey],k)=>{h+=`<circle cx="${ex}" cy="${ey}" r="6" fill="${k<val(n)?'var(--an)':'var(--cat)'}" stroke="var(--surface)" stroke-width="1.5"/>`});
        if(solved)h+=`<path d="M${x-50} ${y-50}h-6v100h6M${x+50} ${y-50}h6v100h-6" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="${x+60}" y="${y-44}" class="svgd" font-size="15" font-weight="700" style="fill:var(--an)">${chg(need,'−')}</text>`;
        else h+=`<text x="${x}" y="${y+64}" text-anchor="middle" class="svgt" font-size="12">${tot}/8</text>`;
      });
      h+='</svg>';$('#sv',box).innerHTML=h;
      $$('.em',box).forEach(e=>e.onclick=()=>send(+e.dataset.i,e));
      $('#mOut',box).value=mc;$('#nOut',box).value=nc;
    }
    function send(i,el){
      if(solved||busy)return;const j=N.findIndex(b=>b.got<need);
      if(j<0){fb(f,'no',`อโลหะทุกอะตอมครบ 8 แล้ว แต่ <b>${m}</b> ยังมีอิเล็กตรอนเหลือ ลองเพิ่มจำนวนอะตอม <b>${n}</b> <span class="en">No atom can accept more electrons — add another ${n}.</span>`);return}
      busy=true;const g=geo(),c=el.querySelectorAll('circle')[1],sx=+c.getAttribute('cx'),sy=+c.getAttribute('cy');
      const[tx,ty]=slotPos(g.nx[j],g.ny,val(n)+N[j].got+1)[val(n)+N[j].got];
      const svg=$('#sv svg',box),dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('r','6');dot.setAttribute('fill','var(--cat)');svg.appendChild(dot);c.setAttribute('opacity','0');
      const t0=performance.now(),T=RM?1:380;
      (function step(t){const k=Math.min(1,(t-t0)/T),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;dot.setAttribute('cx',sx+(tx-sx)*e);dot.setAttribute('cy',sy+(ty-sy)*e-Math.sin(k*Math.PI)*30);
        if(k<1)requestAnimationFrame(step);else{M[i].left--;N[j].got++;busy=false;draw()}})(t0);
    }
    const setC=(dm,dn)=>{if(solved)return;mc=Math.max(1,Math.min(3,mc+dm));nc=Math.max(1,Math.min(3,nc+dn));reset();f.hidden=true;draw()};
    $('#mMinus',box).onclick=()=>setC(-1,0);$('#mPlus',box).onclick=()=>setC(1,0);$('#nMinus',box).onclick=()=>setC(0,-1);$('#nPlus',box).onclick=()=>setC(0,1);
    $('#rs',box).onclick=()=>{if(!solved){reset();f.hidden=true;draw()}};
    $('#ck',box).onclick=()=>{
      if(solved)return;const left=M.some(a=>a.left>0),short=N.some(b=>b.got<need);
      if(left||short){fails++;fb(f,'no',(left&&!short?`โลหะ ${m} ยังมีเวเลนซ์อิเล็กตรอนเหลือ ต้องเพิ่มอะตอม ${n} มารับ`:short&&!left?`อโลหะ ${n} บางอะตอมยังไม่ครบ 8 ต้องเพิ่มอะตอม ${m} มาให้อิเล็กตรอน`:'ยังถ่ายโอนอิเล็กตรอนไม่ครบ แตะอิเล็กตรอนสีส้มต่อ')+` <span class="en">Not balanced yet.</span>`);return}
      if(gcd(mc,nc)>1){fails++;fb(f,'no',`ถ่ายโอนลงตัวแล้ว แต่จำนวนอะตอม ${mc}:${nc} ยังไม่ใช่อัตราส่วนอย่างต่ำ ลองลดจำนวนลง <span class="en">Use the lowest whole-number ratio.</span>`);return}
      solved=true;const pts=tryPts(10,fails);api.give('tr',pts);draw();
      const formula=m+(mc>1?mc:'')+n+(nc>1?nc:'');
      fb(f,'ok',`${praise()} +${pts} คะแนน`);
      $('#ck',box).disabled=true;$('#rs',box).disabled=true;$$('.stepper button',box).forEach(b=>b.disabled=true);

    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" id="ck">ตรวจชั้นผลึก <span class="en" style="color:inherit">Check</span></button></div></div><div class="fb" hidden id="f"></div><div id="after"></div>`;
    const f=$('#f',box),gd=$('#gd',box);
    const bad=()=>{const B=new Set();for(let i=0;i<N;i++)for(let j=0;j<N;j++){const v=S[i*N+j];if(!v)continue;[[0,1],[1,0]].forEach(([a,b])=>{const ii=i+a,jj=j+b;if(ii<N&&jj<N&&S[ii*N+jj]===v){B.add(i*N+j);B.add(ii*N+jj)}})}return B};

  box.innerHTML=`<h3 class="stepTitle">เรียงขั้นการเกิด NaCl(s) จาก Na(s) และ Cl₂(g)</h3><p class="stepLead">แตะบัตรเพื่อเรียงลำดับขั้นย่อยทั้ง 5 ขั้น (แตะบัตรในลำดับเพื่อนำออก) อะตอมต้องเป็นแก๊สก่อนจึงจะกลายเป็นไอออน และไอออนแก๊สรวมกันเป็นผลึกในขั้นสุดท้าย <span class="en">Order the Born–Haber steps.</span></p>
  <div class="stage"><div class="en" style="margin-bottom:6px">บัตรขั้นตอน · Step cards</div><div class="tiles" id="pool"></div><div class="en" style="margin:12px 0 6px">ลำดับของฉัน · My sequence</div><div class="seq" id="seq"></div>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="ck" disabled>ตรวจลำดับ <span class="en" style="color:inherit">Check</span></button></div></div><div class="fb" hidden id="f"></div><div id="after"></div>`;
  const f=$('#f',box);let solved=false;
  function draw(){$('#pool',box).innerHTML=pool.map(k=>`<button class="tile ${seq.includes(k)?'used':''}" data-k="${k}" ${seq.includes(k)?'disabled':''}>${eq(BH[k].e)}<br><span class="en">${BH[k].th}</span></button>`).join('');
    $('#seq',box).innerHTML=seq.length?seq.map((k,i)=>`<button class="tile" data-k="${k}"><b>${i+1}</b><span>${eq(BH[k].e)}</span></button>`).join(''):'<span class="en">ยังไม่มีบัตร แตะบัตรด้านบน</span>';
    $$('#pool .tile',box).forEach(b=>b.onclick=()=>{if(!solved){seq.push(b.dataset.k);draw()}});
    $$('#seq .tile',box).forEach(b=>b.onclick=()=>{if(!solved){seq=seq.filter(k=>k!==b.dataset.k);draw()}});
    $('#ck',box).disabled=seq.length<5||solved}
  draw();
  $('#ck',box).onclick=()=>{const p=k=>seq.indexOf(k);
    if(p('lat')!==4){fails++;fb(f,'no','ขั้นการรวมไอออนแก๊สเป็นผลึกต้องอยู่สุดท้าย เพราะต้องมี Na⁺(g) และ Cl⁻(g) ก่อน');return}
    if(p('sub')>p('ie')){fails++;fb(f,'no','Na ต้องเป็นแก๊สก่อน (ระเหิด) จึงจะดึงอิเล็กตรอนออกได้');return}
    if(p('dis')>p('ea')){fails++;fb(f,'no','ต้องแตกพันธะ Cl₂ ให้ได้อะตอม Cl(g) ก่อน จึงจะรับอิเล็กตรอนได้');return}
    solved=true;BHorder=seq.slice();const pts=tryPts(15,fails);api.give('or',pts);draw();
    fb(f,'ok',`${praise()} +${pts} คะแนน · ลำดับที่ถูกต้องมีได้มากกว่าหนึ่งแบบ ขอเพียงอะตอมกลายเป็นแก๊สก่อนเป็นไอออน และการเกิดผลึกอยู่สุดท้าย`);done()};
}
function actClassify(box,api,done){
  api.reg('cl',15);let left=5;
  box.innerHTML=`<h3 class="stepTitle">ขั้นใดดูดพลังงาน ขั้นใดคายพลังงาน</h3><p class="stepLead">เลือกให้ครบทุกขั้น เมื่อถูกต้อง ลูกศรจะปรากฏบนแผนภาพระดับพลังงาน (หน่วย kJ/mol) <span class="en">Classify each step as endothermic (+) or exothermic (−).</span></p>
  <div class="stage" id="list"></div><div class="stage" style="margin-top:12px" id="lad"></div><div class="fb" hidden id="f"></div>`;
  const done5=new Set();
  function lad(){const ord=BHorder.filter(k=>done5.has(k));$('#lad',box).innerHTML=done5.size===5?ladderSVG(BHorder,false):`<p class="en" style="text-align:center;margin:8px">ทำถูก ${done5.size}/5 ขั้น แผนภาพจะสมบูรณ์เมื่อครบ</p>`}
  $('#list',box).innerHTML=BHorder.map((k,i)=>`<div class="cls" data-k="${k}"><div><b>${i+1}.</b> <span class="eq">${eq(BH[k].e)}</span><br><span class="en">${BH[k].th} · |ΔH| = ${Math.abs(BH[k].v)} kJ</span></div><div class="tog"><button class="btn sm" data-s="1">ดูด (+)</button><button class="btn sm" data-s="-1">คาย (−)</button></div></div>`).join('');
  const fails={};
  $$('.cls',box).forEach(row=>{const k=row.dataset.k;fails[k]=0;$$('button',row).forEach(b=>b.onclick=()=>{if(done5.has(k))return;
    if(Math.sign(BH[k].v)===+b.dataset.s){b.classList.add('on-ok');done5.add(k);const p=tryPts(3,fails[k]);api.give('cl',p);
      fb($('#f',box),'ok',`${praise()} ${BH[k].v>0?'ต้องใช้พลังงานเพื่อแยกอนุภาคหรือดึงอิเล็กตรอนออก':'ระบบปล่อยพลังงานออกมาเมื่อเกิดแรงดึงดูด'}`);lad();if(done5.size===5)done()}
    else{b.classList.add('on-no');fails[k]++;fb($('#f',box),'no','ลองคิดใหม่: การแยกอนุภาคออกจากกันต้องใช้พลังงาน ส่วนการที่อนุภาคดึงดูดกันจะคายพลังงาน')}})});
  lad();
}
function actTotal(box,api,done){

  <div class="stage" id="lad">${ladderSVG(BHorder,false)}</div>
  <div class="stage" style="margin-top:12px"><p class="eq" style="margin-top:0">ΔH = (+107) + (+122) + (+496) + (−349) + (−787) = ?</p><div class="row"><div class="field" style="flex:0 1 200px"><label for="dh">ΔH (kJ/mol)</label><input type="text" id="dh" inputmode="text" placeholder="เช่น −250"></div><button class="btn primary" id="ck" style="align-self:flex-end">ตรวจคำตอบ</button></div></div><div class="fb" hidden id="f"></div>`;

      fb($('#f',box),'ok',`${praise()} +${p} คะแนน · ΔH = −411 kJ/mol เป็นค่าลบ แปลว่าการเกิด NaCl(s) จากธาตุคายพลังงาน สารประกอบจึงเสถียรกว่าธาตุตั้งต้น ขั้นที่ทำให้ผลรวมเป็นลบมากที่สุดคือการเกิดผลึก (−787)`);done()}
    else if(Math.abs(v-411)<=1.5){fails++;fb($('#f',box),'no','ตัวเลขถูก แต่เครื่องหมายผิด ผลรวมพลังงานคายออกมากกว่าดูดเข้า')}
    else{fails++;fb($('#f',box),'no','ยังไม่ถูก ลองรวมขั้นดูด 107 + 122 + 496 แล้วลบด้วยขั้นคาย 349 + 787')}};
}

function actMelt(box,api,done){

    $$('#pool .tile',box).forEach(b=>b.onclick=()=>{if(!solved){seq.push(b.dataset.f);draw()}});$('#ck',box).disabled=seq.length<3||solved}

function beakers(m,mixed){const B=(x,lab,fill,ppt)=>`<path d="M${x} 60 L${x+6} 150 H${x+74} L${x+80} 60" fill="none" stroke="var(--ink)" stroke-width="2.5"/><rect x="${x+4}" y="90" width="72" height="58" style="fill:${fill}"/>${ppt?Array.from({length:22},(_,k)=>`<circle cx="${x+12+(k*13)%60}" cy="${141-(k%3)*4}" r="3.4" fill="${ppt}" stroke="var(--ink)" stroke-width=".6"/>`).join(''):''}<text x="${x+40}" y="176" text-anchor="middle" class="svgd" font-size="13">${lab}</text>`;

function actPrecip(box,api,done){

    box.innerHTML=`<div class="roundTag">การทดลองที่ ${i+1}/${MIX.length} · MIX ${i+1}</div><h3 class="stepTitle">ผสม ${fm(m.a)}(aq) กับ ${fm(m.b)}(aq)</h3>${RULES}

    mcq($('#qs',box),{q:'ทำนายผลการผสม <span class="en">Predict the result</span>',o:m.o,x:''},{key:'pr',max:5,api,onDone:()=>{
      $('#bk',box).innerHTML=beakers(m,m.ppt?'ppt':'none');
      const nx=()=>{$('#after',box).innerHTML=`<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="nx">${i<MIX.length-1?'การทดลองถัดไป →':'ครบทุกการทดลอง ✓'}</button></div>`;$('#nx',box).onclick=()=>{if(i<MIX.length-1){i++;round()}else{$('#nx',box).disabled=true;done()}}};
      if(!m.ppt){api.give('pr',5);$('#net',box).innerHTML=`<div class="fb info">${eq(m.mol)}<br>ไอออน Na⁺, Cl⁻, K⁺, NO₃⁻ ยังคงอยู่ในสารละลายทั้งหมด ไม่มีคู่ไอออนที่รวมกันเป็นสารไม่ละลายน้ำ จึงไม่มีสมการไอออนิกสุทธิ (+5 คะแนน)</div>`;nx();return}
      netIonic($('#net',box),m,nx)}});
  }
  function netIonic(host,m,next){let X=new Set(),fails=0,ok=false;
    host.innerHTML=`<div class="q"><p class="qtext">สมการโมเลกุล: <span class="eq">${eq(m.mol)}</span></p><p class="qtext">แตะไอออนที่ไม่ได้ทำปฏิกิริยา (spectator ions) เพื่อขีดฆ่าออก แล้วตรวจสมการไอออนิกสุทธิ <span class="en">Strike out the spectator ions.</span></p><div id="tk"></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="ck">ตรวจสมการ</button></div><div class="fb" hidden id="f2"></div></div>`;
    const draw=()=>{const tok=(t,side)=>`<button class="tok ${X.has(t[1])?'x':''} ${/\(s\)/.test(t[0])?'fixed':''}" data-k="${t[1]}">${eq(t[0])}</button>`;
      $('#tk',host).innerHTML=m.L.map(t=>tok(t)).join(' + ')+' <b>→</b> '+m.Rr.map(t=>tok(t)).join(' + ');
      $$('.tok',host).forEach(b=>b.onclick=()=>{if(ok||b.classList.contains('fixed'))return;const k=b.dataset.k;X.has(k)?X.delete(k):X.add(k);draw()})};draw();
    $('#ck',host).onclick=()=>{if(ok)return;const good=m.sp.length===X.size&&m.sp.every(k=>X.has(k));
      if(good){ok=true;const p=tryPts(5,fails);api.give('pr',p);fb($('#f2',host),'ok',`${praise()} +${p} คะแนน<br>สมการไอออนิกสุทธิ: <span class="eq">${eq(m.net)}</span>`);next()}

  round();
}

/* ---------- generic MCQ ---------- */
function mcq(host,it,{retry=true,max=10,key,api,onDone}){
  const w=document.createElement('div');w.className='q';const ord=shuffle(it.o.map((t,i)=>({t,i})));
  w.innerHTML=`<p class="qtext">${it.q}</p><div class="opts">${ord.map(o=>`<button class="opt" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="fb" hidden></div>`;host.appendChild(w);
  let f=0,fin=false;const F=$('.fb',w);
  $$('.opt',w).forEach(b=>b.onclick=()=>{if(fin)return;const i=+b.dataset.i;
    if(i===0){fin=true;b.classList.add('ok');const p=retry?tryPts(max,f):max;api.give(key,p);$$('.opt',w).forEach(x=>x.disabled=true);fb(F,'ok',`${praise()} +${Math.round(p*10)/10} คะแนน${it.x?'<br>'+it.x:''}`);onDone&&onDone(true)}
    else{b.classList.add('no');b.disabled=true;f++;
      if(!retry){fin=true;$$('.opt',w).forEach(x=>{x.disabled=true;if(+x.dataset.i===0)x.classList.add('ok')});api.give(key,0);fb(F,'no',`คำตอบที่ถูกคือ “${it.o[0]}”${it.x?'<br>'+it.x:''}`);onDone&&onDone(false)}
      else fb(F,'no','ยังไม่ใช่ ลองอีกครั้ง <span class="en">Try again.</span>')}});
}

  $('#bar').innerHTML=`<button class="chip home ${active==='home'?'on':''}" data-go="home"><span>⌂ หน้าหลัก</span></button>`+STATIONS.map(s=>{const p=P.st[s.id];return `<button class="chip ${active===s.id?'on':''} ${p?'done':''}" data-go="${s.id}"><b>${s.code}</b><span>${s.short}</span><i>${p?('★'.repeat(p.stars)||'✓'):''}</i></button>`}).join('');
  $$('[data-go]',$('#bar')).forEach(b=>b.onclick=()=>go(b.dataset.go));
  const on=$('.chip.on',$('#bar'));if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function go(id){stopAnims();if(id==='home')home();else station(id);scrollTo(0,0)}
function totals(){let s=0,d=0;STATIONS.forEach(x=>{const p=P.st[x.id];if(p){s+=p.score;d++}});return{s,d,n:STATIONS.length}}
function home(){
  RUN=null;bar('home');const{s,d,n}=totals();
  $('#app').innerHTML=`<header class="hero"><canvas id="hc" aria-hidden="true"></canvas><div class="wrap"><div class="eyebrow">ชุดเกมพันธะไอออนิก · เกมที่ ${GAME.no}/4 · หัวข้อ ${GAME.topics}</div>
  <h1>${GAME.th}<small>${GAME.en.toUpperCase()}</small></h1><p>${GAME.intro}</p>${IonicAR.homeBtn()}</div></header>
  <div class="wrap section"><div class="panel"><div class="row" style="align-items:flex-end">
    <div class="field"><label for="sn">ชื่อ–นามสกุลนักเรียน (แสดงบนเกียรติบัตร)</label><input type="text" id="sn" value="${esc(P.student)}" placeholder="เช่น นายสมชาย ใจดี ม.4/1"></div>
    <div style="flex:1 1 200px;min-width:0"><div class="row" style="justify-content:space-between"><span>ผ่านแล้ว <b class="num">${d}/${n}</b> ด่าน</span><span class="num"><b>${s}</b>/${n*100} คะแนน</span></div><div class="meter" style="margin-top:6px"><i style="width:${s/n}%"></i></div></div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="allc" ${d<n?'disabled':''}>🏅 เกียรติบัตรพิชิตเกม (ครบ ${n} ด่าน)</button><span class="en">เล่นด่านใดก่อนก็ได้ ทุกด่านมีเกียรติบัตร</span></div></div></div>
  <div class="wrap"><ol class="strata">${STATIONS.map(st=>{const p=P.st[st.id];return `<li class="stratum ${p?'done':''}"><div class="card"><div><div class="depth">${st.code} · หัวข้อ ${st.topic}</div><h3>${st.th}</h3><div class="place">${st.desc} · <span class="en">${st.en}</span></div>${p?`<div class="stars" style="margin-top:4px">${starStr(p.stars)} <span class="en num">${p.score}/100</span></div>`:''}</div>
    <div class="row">${p?`<button class="btn sm" data-cert="${st.id}">เกียรติบัตร</button>`:''}<button class="btn ${p?'':'primary'}" data-go="${st.id}">${p?'เล่นอีกครั้ง':'เริ่มด่าน →'}</button></div></div></li>`}).join('')}</ol></div>
  <div class="wrap section"><div class="panel"><div class="tg-mount"><div><h3 style="margin:0 0 4px">สำหรับครู</h3><p>${IonicGuide.plan()}</p></div><button class="btn" id="tgBtn">คู่มือครู · ความสอดคล้องกับแผนการสอน</button></div></div></div>
  <div class="wrap"><div class="foot"><div class="row" style="margin-bottom:10px"><button class="btn sm" id="setb">ตั้งค่าเกียรติบัตร</button></div>
  <p style="margin:0 0 6px">ชุดเกมพันธะไอออนิก 4 เกม: ${SERIES.map(g=>g[0]===String(GAME.no)?`<b>${g[0]}. ${g[1]} (${g[2]})</b>`:`${g[0]}. ${g[1]} (${g[2]})`).join(' · ')}</p>พัฒนาเกมโดย ${esc(SET.dev)} · เนื้อหาตามหนังสือเรียนรายวิชาเพิ่มเติมเคมี หัวข้อ 3.2 พันธะไอออนิก</div></div>`;
  crystal($('#hc'),{n:2,scale:1.05});
  $('#sn').oninput=e=>{P.student=e.target.value;saveP()};
  $$('[data-go]',$('#app')).forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('[data-cert]').forEach(b=>b.onclick=()=>certModal(b.dataset.cert));
  $('#allc').onclick=()=>certModal('all');$('#tgBtn').onclick=()=>IonicGuide.open();$('#setb').onclick=settings;
}
let RUN=null;
function station(id){
  const st=STATIONS.find(s=>s.id===id);bar(id);
  const steps=[];if(st.learn)steps.push({t:'บัตรสรุป',en:'Key ideas',r:learnStep});
  steps.push(st.quiz?{t:'แบบทดสอบ',en:'Checkpoint',r:quizStep}:{t:'ภารกิจ',en:st.en,r:st.act});steps.push({t:'ผลคะแนน',en:'Result',r:resultStep});
  RUN={st,steps,earn:{},max:{},i:0};
  $('#app').innerHTML=`<div class="wrap"><div class="st-head"><div class="code">${GAME.th} · ${st.code} · หัวข้อ ${st.topic}</div><h2>${st.th}</h2><div class="en">${st.en}</div>${IonicAR.stBtn(st.id)}<div class="pips" id="pips"></div></div><div id="sb"></div><div class="nav" id="nav"><button class="btn primary" id="next" disabled>ถัดไป</button></div></div>`;
  $('#next').onclick=()=>show(RUN.i+1);show(0);
}
const api={reg(k,m){RUN.max[k]=m},give(k,p){RUN.earn[k]=(RUN.earn[k]||0)+p}};
function show(i){
  RUN.i=i;const S=RUN.steps;stopAnims();
  $('#pips').innerHTML=S.map((s,k)=>`<span class="pip ${k===i?'on':k<i?'ok':''}">${k<i?'✓ ':''}${s.t}</span>`).join('');
  const b=$('#sb');b.innerHTML='';const nx=$('#next');nx.disabled=true;$('#nav').hidden=i===S.length-1;
  nx.innerHTML=i===S.length-2?'ดูผลคะแนน <span class="en" style="color:inherit">Result →</span>':'เริ่มภารกิจ <span class="en" style="color:inherit">Start →</span>';
  const box=document.createElement('div');b.appendChild(box);
  S[i].r(box,api,()=>{nx.disabled=false;toast(praise())});
  if(i)$('.st-head').scrollIntoView({behavior:RM?'auto':'smooth'});
}
function learnStep(box){
  const L=RUN.st.learn;box.innerHTML=`<h3 class="stepTitle">บัตรสรุปความรู้</h3><p class="stepLead">อ่านบัตร ${L.length} ใบ แล้วกดเริ่มภารกิจ <span class="en">Read the key ideas, then start.</span></p><div class="cards">${L.map(([t,h])=>`<div class="lcard"><h3>${t}</h3>${h}</div>`).join('')}</div>`;
  $('#next').disabled=false;
}
function quizStep(box,api){
  const Q=RUN.st.quiz;api.reg('qz',Q.length*10);
  box.innerHTML=`<h3 class="stepTitle">แบบทดสอบ ${Q.length} ข้อ</h3><p class="stepLead">ตอบได้ข้อละ 1 ครั้ง อ่านคำอธิบายหลังตอบทุกข้อ <span class="en">One attempt per question.</span></p><div id="qs"></div>`;
  let c=0;Q.forEach((it,k)=>{mcq($('#qs',box),{...it,q:`${k+1}. ${it.q}`},{retry:false,max:10,key:'qz',api,onDone:()=>{if(++c===Q.length){$('#next').disabled=false;toast('ตอบครบทุกข้อแล้ว')}}})});
}
function resultStep(box){
  const st=RUN.st,E=Object.values(RUN.earn).reduce((a,b)=>a+b,0),M=Object.values(RUN.max).reduce((a,b)=>a+b,0)||1,score=Math.min(100,Math.round(100*E/M)),[md,mde,stars]=medalOf(score);
  const prev=P.st[st.id];if(!prev||score>=prev.score){P.st[st.id]={score,stars,date:thaiDate()};saveP()}bar(st.id);
  const best=P.st[st.id],msg=stars===3?'ยอดเยี่ยม! เข้าใจเนื้อหาด่านนี้อย่างแม่นยำ':stars===2?'ทำได้ดีมาก เหลืออีกนิดเดียวก็ได้เหรียญทอง':stars===1?'ผ่านด่านนี้แล้ว ทบทวนบัตรสรุปแล้วเล่นอีกครั้งเพื่อเหรียญที่สูงขึ้น':'ได้เรียนรู้ครบทุกขั้นแล้ว ลองเล่นอีกครั้งเพื่อเก็บคะแนนเพิ่ม';
  const nextSt=STATIONS[STATIONS.indexOf(st)+1],t=totals();
  box.innerHTML=`<div class="panel result"><div class="en">คะแนน${st.code}</div><div class="score">${score}<span style="font-size:.4em;color:var(--muted)">/100</span></div><div class="stars">${starStr(stars)}</div><div class="medal">${md} · ${mde}</div><p>${msg}${best.score>score?`<br><span class="en">คะแนนสูงสุดที่บันทึกไว้: ${best.score}</span>`:''}${t.d===t.n?'<br><b>ผ่านครบทุกด่านแล้ว รับเกียรติบัตรพิชิตเกมได้ที่หน้าหลัก</b>':''}</p>
  <div class="row" style="justify-content:center"><button class="btn primary" id="ce">🏅 รับเกียรติบัตรด่านนี้</button><button class="btn" id="re">เล่นอีกครั้ง</button>${nextSt?`<button class="btn" id="nx">${nextSt.code} →</button>`:''}<button class="btn quiet" id="hm">กลับหน้าหลัก</button></div></div>`;
  if(stars>=2)confetti();
  $('#ce',box).onclick=()=>certModal(st.id);$('#re',box).onclick=()=>go(st.id);$('#hm',box).onclick=()=>go('home');if(nextSt)$('#nx',box).onclick=()=>go(nextSt.id);
}

/* ---------- modals ---------- */
function modal(html){const r=$('#modalRoot');r.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;const m=$('.modal',r);const close=()=>r.innerHTML='';m.onclick=e=>{if(e.target===m)close()};$$('[data-close]',r).forEach(b=>b.onclick=close);return{root:$('.box',r),close}}
function shrink(file,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.src=fr.result};fr.readAsDataURL(file)}
function settings(){
  const F=(id,l)=>`<div class="field"><label for="${id}">${l}</label><input type="text" id="${id}" value="${esc(SET[id])}"></div>`;
  const{root,close}=modal(`<h2>ตั้งค่าเกียรติบัตร</h2><p class="en">ข้อมูลนี้เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p>${F('school','ชื่อโรงเรียน')}<div class="row">${F('teacher','ชื่อครูผู้สอน')}${F('teacherPos','ตำแหน่งครู')}</div><div class="sig"><label class="btn sm">แนบลายเซ็นครู (รูปภาพ)<input type="file" accept="image/*" id="fT" hidden></label><span id="pT">${SET.sigT?`<img src="${SET.sigT}" alt="ลายเซ็นครู">`:'<span class="en">ยังไม่มี</span>'}</span></div>
  <div class="row">${F('director','ชื่อผู้อำนวยการ')}${F('directorPos','ตำแหน่งผู้อำนวยการ')}</div><div class="sig"><label class="btn sm">แนบลายเซ็นผู้อำนวยการ<input type="file" accept="image/*" id="fD" hidden></label><span id="pD">${SET.sigD?`<img src="${SET.sigD}" alt="ลายเซ็นผู้อำนวยการ">`:'<span class="en">ยังไม่มี</span>'}</span></div>
  ${F('dev','ผู้พัฒนาเกม')}<div class="row" style="justify-content:space-between"><button class="btn sm quiet" id="rst">ล้างความคืบหน้าเกมนี้</button><div class="row"><button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="sv">บันทึก</button></div></div>`);
  let sT=SET.sigT,sD=SET.sigD;
  $('#fT',root).onchange=e=>e.target.files[0]&&shrink(e.target.files[0],u=>{sT=u;$('#pT',root).innerHTML=`<img src="${u}" alt="">`});
  $('#fD',root).onchange=e=>e.target.files[0]&&shrink(e.target.files[0],u=>{sD=u;$('#pD',root).innerHTML=`<img src="${u}" alt="">`});
  let arm=false;$('#rst',root).onclick=e=>{if(!arm){arm=true;e.target.textContent='กดอีกครั้งเพื่อยืนยันการล้าง';return}P={student:P.student,st:{}};saveP();close();go('home');toast('ล้างความคืบหน้าแล้ว')};
  $('#sv',root).onclick=()=>{['school','teacher','teacherPos','director','directorPos','dev'].forEach(k=>SET[k]=$('#'+k,root).value.trim());SET.sigT=sT;SET.sigD=sD;saveS();store.set('ionic-series:s',SET);close();toast('บันทึกการตั้งค่าแล้ว');if(!RUN)home()};
}
function loadImg(src){return new Promise(r=>{if(!src)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function drawCert(id){
  try{await Promise.all(['700 80px "Chakra Petch"','600 40px "Chakra Petch"','400 30px Sarabun','700 60px Sarabun'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const all=id==='all',st=STATIONS.find(s=>s.id===id),t=totals(),score=all?t.s:P.st[id].score,[md,mde,stars]=medalOf(all?Math.round(t.s/t.n):score);
  x.fillStyle='#fbfcfd';x.fillRect(0,0,W,H);
  x.fillStyle='#16212c';x.fillRect(0,0,W,30);x.fillRect(0,H-30,W,30);x.fillRect(0,0,30,H);x.fillRect(W-30,0,30,H);
  for(let k=0;k<40;k++){const px=60+k*(W-120)/39;[[px,62],[px,H-62]].forEach(([a,b],j)=>{x.fillStyle=(k+j)%2?'#0c7a6e':'#b5600b';x.beginPath();x.arc(a,b,(k+j)%2?11:8,0,7);x.fill()})}
  for(let k=1;k<27;k++){const py=62+k*(H-124)/27;[[62,py],[W-62,py]].forEach(([a,b],j)=>{x.fillStyle=(k+j)%2?'#0c7a6e':'#b5600b';x.beginPath();x.arc(a,b,(k+j)%2?11:8,0,7);x.fill()})}
  x.strokeStyle='#c8d0d8';x.lineWidth=2;x.strokeRect(100,100,W-200,H-200);
  x.textAlign='center';x.fillStyle='#16212c';x.font='600 34px Sarabun';x.fillText(SET.school||'',W/2,170);
  x.fillStyle='#ad2f5a';x.font='700 104px "Chakra Petch"';x.fillText('เกียรติบัตร',W/2,290);
  x.fillStyle='#56636f';x.font='600 28px "Chakra Petch"';x.fillText('CERTIFICATE OF ACHIEVEMENT · '+GAME.en.toUpperCase(),W/2,338);
  x.fillStyle='#18212a';x.font='400 34px Sarabun';x.fillText('ขอมอบเกียรติบัตรฉบับนี้ให้ไว้เพื่อแสดงว่า',W/2,410);
  x.font='700 66px Sarabun';x.fillText(P.student||'..............................................',W/2,500);
  x.strokeStyle='#c8d0d8';x.beginPath();x.moveTo(W/2-420,520);x.lineTo(W/2+420,520);x.stroke();
  x.font='400 34px Sarabun';x.fillText(all?`พิชิตเกม “${GAME.th}” ครบทั้ง ${t.n} ด่าน`:`ผ่าน${st.code} ${st.th}`,W/2,585);
  x.font='400 30px Sarabun';x.fillStyle='#56636f';x.fillText(`เกม${GAME.th} · หัวข้อ ${all?GAME.topics:st.topic} พันธะไอออนิก · รายวิชาเพิ่มเติมเคมี ชั้นมัธยมศึกษาปีที่ 4`,W/2,632);
  x.fillStyle='#18212a';x.font='700 40px "Chakra Petch"';x.fillText(`คะแนน ${score}/${all?t.n*100:100}  ·  ${md} (${mde})`,W/2,705);
  x.fillStyle='#c99a1c';x.font='700 54px Sarabun';x.fillText('★'.repeat(stars)+'☆'.repeat(3-stars),W/2,768);
  x.fillStyle='#56636f';x.font='400 28px Sarabun';x.fillText('ให้ไว้ ณ วันที่ '+thaiDate(),W/2,822);
  const[iT,iD]=await Promise.all([loadImg(SET.sigT),loadImg(SET.sigD)]);
  [[W*.3,iT,SET.teacher,SET.teacherPos],[W*.7,iD,SET.director,SET.directorPos]].forEach(([cx,im,nm,pos])=>{
    if(im){const k=Math.min(300/im.width,110/im.height);x.drawImage(im,cx-im.width*k/2,975-im.height*k,im.width*k,im.height*k)}
    x.strokeStyle='#56636f';x.lineWidth=1.5;x.beginPath();x.moveTo(cx-190,985);x.lineTo(cx+190,985);x.stroke();
    x.fillStyle='#18212a';x.font='400 30px Sarabun';x.fillText(nm?`(${nm})`:'(......................................................)',cx,1030);x.fillStyle='#56636f';x.font='400 26px Sarabun';x.fillText(pos||'',cx,1070)});
  x.fillStyle='#8a96a1';x.font='400 21px Sarabun';x.fillText('พัฒนาเกมโดย '+(SET.dev||''),W/2,1122);
  x.save();x.translate(W-250,250);x.fillStyle=stars===3?'#c99a1c':stars===2?'#9aa6b2':stars===1?'#b5733b':'#0c7a6e';x.beginPath();x.arc(0,0,78,0,7);x.fill();x.fillStyle='#fff';x.font='700 26px "Chakra Petch"';x.fillText(all?'ALL':st.code,0,-4);x.font='600 22px Sarabun';x.fillText(mde.toUpperCase(),0,30);x.restore();
  return c.toDataURL('image/png');
}
function certModal(id){
  const{root}=modal(`<h2>เกียรติบัตร</h2>${P.student?'':`<div class="field"><label for="cn">ใส่ชื่อนักเรียนก่อนรับเกียรติบัตร</label><input type="text" id="cn" placeholder="ชื่อ–นามสกุล ชั้น/ห้อง"></div><button class="btn primary" id="cg">สร้างเกียรติบัตร</button>`}<div id="ci"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>ปิด</button></div>`);
  const make=async()=>{$('#ci',root).innerHTML='<p class="en">กำลังสร้างเกียรติบัตร…</p>';const url=await drawCert(id);
    $('#ci',root).innerHTML=`<img class="cert" src="${url}" alt="เกียรติบัตร"><p class="en">บันทึกภาพ: แตะค้างที่ภาพ (มือถือ) หรือคลิกขวา › บันทึกรูปภาพ (คอมพิวเตอร์) </p>${location.protocol==='file:'?`<a class="btn primary" href="${url}" download="certificate-${GAME.id}-${id}.png">ดาวน์โหลด PNG</a>`:''}`};
  if(P.student)make();else $('#cg',root).onclick=()=>{const v=$('#cn',root).value.trim();if(!v){$('#cn',root).focus();return}P.student=v;saveP();if($('#sn'))$('#sn').value=v;$('#cg',root).remove();$('.field',root).remove();make()};
}
function boot(g){
  GAME=g;STATIONS=g.levels;KEY='ionic-'+g.id+'-v1';
  P=Object.assign({student:'',st:{}},store.get(KEY+':p',{}));
  SET=Object.assign({school:'โรงเรียนธาตุพนม',teacher:'นางมัณฑนา ไชยสงค์',teacherPos:'ครูผู้สอนรายวิชาเคมี',director:'',directorPos:'ผู้อำนวยการโรงเรียน',sigT:'',sigD:'',dev:'นางมัณฑนา ไชยสงค์ ครูโรงเรียนธาตุพนม'},store.get('ionic-series:s',{}),store.get(KEY+':s',{}));
  home();
}

const GAMES={
