<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>นักตัดต่อพันธะ</title>
<style>
:root{
  --bg:#0f1730; --panel:#172248; --panel2:#1f2d5c; --line:#2d3d73; --ink:#eef2ff; --mute:#a9b4d8;
  --push:#ff9a3c; --pull:#b48cff; --ok:#45d39a; --bad:#ff6b7a; --amber:#ffc94a; --mag:#ff5fd2;
  --font:"Noto Sans Thai","Sarabun","Leelawadee UI","Thonburi","Tahoma",system-ui,sans-serif;
  --big:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
body.bigtext{--big:1.35}
button{font-family:inherit;font-size:calc(15px*var(--big));color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,#3a63ff,#7b4dff);border:none;font-weight:600}
button.push{background:linear-gradient(135deg,#ff8a2b,#ffb35c);border:none;color:#2a1500;font-weight:700}
button.pull{background:linear-gradient(135deg,#8f62ff,#c39bff);border:none;color:#1b0b3a;font-weight:700}
button.on{background:#2f6bff;border-color:#2f6bff}
button.ghost{background:transparent}
button:disabled{opacity:.45}
input,textarea{font-family:inherit;font-size:15px;background:#0c1328;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.screen{position:absolute;inset:0;display:none;overflow:auto}
.screen.show{display:block}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;margin:6px 0 2px;line-height:1.2}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:16px;margin:16px 0 6px;color:var(--mute);font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.chip.push{background:var(--push);color:#2a1500}.chip.pull{background:var(--pull);color:#1b0b3a}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left}
.card b{font-size:19px;display:block;margin-bottom:4px}
.card span{color:var(--mute);font-size:14px}
.card.push,.card.pull{background:var(--panel);color:var(--ink);font-weight:400}.card.push{border-left:6px solid var(--push)}.card.pull{border-left:6px solid var(--pull)}
.card.ch{border-left:6px solid var(--ok)}.card.tc{border-left:6px solid #6fa8ff}
.credit{margin-top:26px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.grid button{min-width:84px;font-size:calc(18px*var(--big));font-weight:600}
.cyc{font-size:calc(18px*var(--big));margin:22px 0 8px;color:#fff}.cyc span{font-weight:400;color:var(--mute);font-size:calc(14px*var(--big))}
.stepblk{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0 14px}
.stepblk.s3{border-left-color:#4f8cff}.stepblk.s4{border-left-color:#ffc94a}.stepblk.s5{border-left-color:#45d39a}
.stephead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.stepchip{font-size:calc(13px*var(--big));font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.workchip{font-size:calc(12px*var(--big));color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.item{margin:8px 0 10px}.item.nogame{margin:4px 0}.item.nogame .itlab{color:var(--mute);margin-bottom:0}.item.nogame .grid{display:none}.itlab{font-size:calc(14px*var(--big));margin-bottom:6px;color:#dfe6ff}
button.cmpbtn{background:#1b3a7a;border-color:#4f8cff;font-size:calc(14px*var(--big))!important}
.note{color:var(--mute);font-size:14px}
/* viewer */
#viewer{overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#24356e 0%,#0f1730 70%)}
#viewer.cam{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.vtop{position:absolute;left:0;right:0;top:0;padding:10px 10px 0;display:flex;gap:6px;align-items:center;z-index:5;padding-top:max(10px,env(safe-area-inset-top))}
.vtop .ttl{flex:1;font-weight:700;font-size:calc(19px*var(--big));text-shadow:0 1px 3px #000;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vtop button{padding:8px 11px;background:rgba(23,34,72,.85)}
.vstep{position:absolute;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 48px);max-width:calc(100% - 20px);z-index:5;font-size:calc(13px*var(--big));font-weight:600;color:#fff;background:rgba(23,34,72,.88);border:1px solid var(--line);border-left:4px solid var(--push);border-radius:10px;padding:5px 10px;line-height:1.4}
.vstep.pull{border-left-color:var(--pull)}.vstep:empty{display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(15,23,48,.92);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:52%;overflow:auto;backdrop-filter:blur(6px)}
.sheet .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.sheet .info{font-size:calc(16px*var(--big));line-height:1.5}
.sheet .info b{color:#fff}
.hint{color:var(--mute);font-size:calc(14px*var(--big))}
.verdict{font-size:calc(22px*var(--big));font-weight:800;margin:4px 0}
.verdict.polar{color:var(--mag)}.verdict.nonpolar{color:var(--ok)}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:9;font-size:14px;max-width:90%;display:none;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opts button{text-align:left}
.opts button.right{background:#1d5c45;border-color:var(--ok)}
.opts button.wrongpick{background:#6b2230;border-color:var(--bad)}
.fb{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:calc(15px*var(--big));line-height:1.5}
.fb.ok{background:#123d30;border:1px solid var(--ok)}.fb.no{background:#3d1520;border:1px solid var(--bad)}
.code{font-size:40px;font-weight:800;letter-spacing:4px;background:#0c1328;border:2px dashed var(--ok);border-radius:14px;padding:10px 18px;display:inline-block;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--panel2)}
tr.hot td{background:#4a1d26}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.guide p,.guide li{line-height:1.6}
.guide ol{padding-left:20px}
.linkrow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.linkrow code{background:#0c1328;padding:6px 8px;border-radius:8px;font-size:13px;word-break:break-all;flex:1;min-width:200px}
#certImg{max-width:100%;border-radius:10px;margin-top:10px;display:none}
.enchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.enchips span{background:#0c1328;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:13px}
.progress{font-weight:700;color:var(--ok)}
.card.mode{border-left:6px solid var(--mc,#6fa8ff)}
.chip.mode{background:var(--mc,#6fa8ff);color:#10132a}
button.mbtn{background:var(--mc,#3a63ff);border:none;color:#10132a;font-weight:700}
.vstep{border-left-color:var(--mc,#ff9a3c)!important}
.ctrlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ctrlrow .lbl{min-width:70px;font-weight:700}
.cnt{font-size:22px;font-weight:800;min-width:34px;text-align:center}
.meter{height:14px;border-radius:8px;background:#0c1328;border:1px solid var(--line);position:relative;overflow:hidden;flex:1;min-width:160px}
.meter i{position:absolute;top:0;bottom:0;background:var(--amber)}
.okline{color:var(--ok);font-weight:700}.badline{color:var(--bad);font-weight:700}
.pickopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:6px 0}
.pickopts button{text-align:left}
.pickopts button.right{background:#1d5c45;border-color:var(--ok)}
.pickopts button.wrongpick{background:#6b2230;border-color:var(--bad)}
.kv{display:inline-block;background:#0c1328;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:calc(14px*var(--big))}
.guide a{color:#9cc2ff}

</style>
</head>
<body>
<div id="home" class="screen"><div class="wrap">
  <div class="topbar"><span class="chip" style="background:#2f6bff;color:#fff">AR</span><button id="langBtn1" class="ghost" onclick="toggleLang()">EN</button></div>
  <h1 data-t="title"></h1><p class="sub" data-t="subtitle"></p>
  <div class="cards" id="homeCards"></div>
  <div class="credit"><span data-t="creditLabel"></span> <b data-t="creditName"></b></div>
</div></div>
<div id="picker" class="screen"><div class="wrap">
  <div class="topbar"><button onclick="go('home')" data-t="home"></button><span id="pickChip" class="chip mode"></span><button class="ghost" onclick="toggleLang()" id="langBtn2">EN</button></div>
  <h1 id="pickTitle"></h1><p class="sub" id="pickSub"></p><div id="pickGroups"></div>
</div></div>
<div id="viewer" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="cv"></canvas>
  <div class="vtop">
    <button onclick="viewerBack()">←</button><div class="ttl" id="vTitle"></div>
    <button id="arBtn" onclick="toggleCam()">AR</button><button id="bigBtn" onclick="toggleBig()">Aa</button>
    <button class="ghost" onclick="toggleLang()" id="langBtn3">EN</button>
  </div>
  <div class="vstep" id="vStep"></div><div class="toast" id="toast"></div><div class="sheet" id="sheet"></div>
</div>
<div id="summary" class="screen"><div class="wrap" id="sumWrap"></div></div>
<div id="teacher" class="screen"><div class="wrap">
  <div class="topbar"><button onclick="go('home')" data-t="home"></button><button class="ghost" onclick="toggleLang()" id="langBtn4">EN</button></div>
  <h1 data-t="teacherTitle"></h1>
  <div class="tabs">
    <button onclick="tTab('guide')" id="tb-guide" data-t="tabGuide"></button><button onclick="tTab('links')" id="tb-links" data-t="tabLinks"></button>
    <button onclick="tTab('decode')" id="tb-decode" data-t="tabDecode"></button><button onclick="tTab('form')" id="tb-form" data-t="tabForm"></button>
  </div>
  <div id="tBody"></div>
  <div class="credit"><span data-t="creditLabel"></span> <b data-t="creditName"></b></div>
</div></div>
<script>
/* =====================================================================
   นักตัดต่อพันธะ — เกม AR แผนที่ 7 ความยาวพันธะ พลังงานพันธะ เรโซแนนซ์ และพลังงานของปฏิกิริยา
   ผู้สร้างและพัฒนาเกม: นางมัณฑนา ไชยสงค์ ครูโรงเรียนธาตุพนม
   ใส่ลิงก์แบบฟอร์มรับรหัสผลของห้องไว้ตรงนี้ก่อนฝากเว็บ (ถ้ามี)
   ===================================================================== */
var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdkG9ndvI_hNgYcYLN0nfKMMLuEmoTfnBKGgpID3cYzljlWVA/viewform";
var HOST_TH="<li>ชุดเกมฝากไว้บนเว็บ GitHub Pages ที่ <a href='https://mantana-website.github.io/chemical-bonding-classroom/' target='_blank' rel='noopener'>mantana-website.github.io/chemical-bonding-classroom</a> ก่อนสอนให้เปิดทดสอบบนอุปกรณ์ของโรงเรียน กดปุ่ม AR และอนุญาตให้ใช้กล้อง ถ้าแก้ไฟล์เกม ให้อัปโหลดไฟล์ใหม่ทับใน repo mantana-website/chemical-bonding-classroom (เข้าสู่ระบบด้วยบัญชี mantana-website) แล้วรอ 1–2 นาทีให้เว็บอัปเดต</li><li>QR code มี 2 แบบ (1) ลิงก์รวมของเกม คือที่อยู่ของไฟล์เกมโดยไม่มีเครื่องหมาย # เกมละ 1 อัน เปิดแล้วเข้าหน้าแรกที่เลือกได้ทุกโหมดและทุกด่านท้าทาย (2) ลิงก์ในแท็บ \"ลิงก์สำหรับ QR code\" ซึ่งลงท้ายด้วย # เปิดเข้าโหมดหรือด่านนั้นโดยตรง ใช้ทำ QR code กลุ่มละ 1 ชุดสำหรับงานกลุ่ม หรือฉายขึ้นจอสำหรับงานเดี่ยว ลิงก์ของครู (ครูฉายขึ้นจอและหน้าครู) ไม่ต้องแจกนักเรียน</li><li>แบบฟอร์มรับรหัสผล (ชื่อ-สกุล ชั้น-เลขที่ รหัสผล และเหตุผลของข้อที่ตอบผิด) ใส่ไว้ในเกมแล้ว นักเรียนกดปุ่ม \"เปิดแบบฟอร์มส่งรหัสผล\" หลังเล่นด่านท้าทายจบ ถ้าเปลี่ยนแบบฟอร์ม ให้แก้ลิงก์ในบรรทัด var FORM_URL ที่ต้นสคริปต์ของทุกไฟล์เกม แล้วอัปโหลดทับใน repo</li>";
var HOST_EN="<li>The games are hosted on GitHub Pages at <a href='https://mantana-website.github.io/chemical-bonding-classroom/' target='_blank' rel='noopener'>mantana-website.github.io/chemical-bonding-classroom</a>. Test on school devices before class, press AR and allow the camera. After changing a game file, upload it over the old one in the mantana-website/chemical-bonding-classroom repo (signed in as mantana-website) and wait 1–2 minutes.</li><li>Two kinds of QR code: (1) the game's main link (the file address without #), one per game, opens the home page with every mode and challenge; (2) the links in the \"Links for QR codes\" tab end with # and open one mode or challenge directly, for group sets or projected individual work. Teacher links (teacher screen, teacher page) are not for students.</li><li>The result form (name, class and number, result code, reasons for wrong items) is already set in every game; students press \"Open the result form\" after a challenge. To change the form, edit var FORM_URL at the top of every game file and upload them again.</li>";
// ---------- ไลบรารีเคมีที่ใช้ร่วมกัน ----------
var D2R=Math.PI/180;
var EL = {
  H:{c:"#f4f4f4",tc:"#222",r:.30,z:1}, He:{c:"#d9ffff",tc:"#222",r:.32,z:2}, Li:{c:"#cc80ff",tc:"#222",r:.42,z:3}, Be:{c:"#c6ff3d",tc:"#222",r:.40,z:4},
  B:{c:"#ffb0a8",tc:"#222",r:.42,z:5}, C:{c:"#4b4f58",tc:"#fff",r:.42,z:6}, N:{c:"#3f63ff",tc:"#fff",r:.40,z:7}, O:{c:"#ff3b30",tc:"#fff",r:.40,z:8},
  F:{c:"#8fe055",tc:"#222",r:.37,z:9}, Ne:{c:"#b3e3f5",tc:"#222",r:.36,z:10}, Na:{c:"#ab5cf2",tc:"#fff",r:.50,z:11}, Mg:{c:"#8aff00",tc:"#222",r:.48,z:12},
  Al:{c:"#bfa6a6",tc:"#222",r:.48,z:13}, Si:{c:"#f0c8a0",tc:"#222",r:.50,z:14}, P:{c:"#ff8a00",tc:"#222",r:.50,z:15}, S:{c:"#ffd21f",tc:"#222",r:.50,z:16},
  Cl:{c:"#2fe04a",tc:"#222",r:.48,z:17}, Ar:{c:"#80d1e3",tc:"#222",r:.46,z:18}, K:{c:"#8f40d4",tc:"#fff",r:.56,z:19}, Ca:{c:"#3dff8a",tc:"#222",r:.54,z:20},
  Fe:{c:"#e06633",tc:"#fff",r:.50,z:26}, Cu:{c:"#c88033",tc:"#fff",r:.50,z:29}, Zn:{c:"#7d80b0",tc:"#fff",r:.50,z:30}, Br:{c:"#a62929",tc:"#fff",r:.54,z:35},
  Rb:{c:"#702eb0",tc:"#fff",r:.60,z:37}, Sr:{c:"#00ff00",tc:"#222",r:.58,z:38}, Ag:{c:"#c0c0c0",tc:"#222",r:.52,z:47}, Sn:{c:"#668080",tc:"#fff",r:.54,z:50},
  I:{c:"#940094",tc:"#fff",r:.60,z:53}, Xe:{c:"#429eb0",tc:"#fff",r:.58,z:54}, Cs:{c:"#57178f",tc:"#fff",r:.64,z:55}, Ba:{c:"#00c900",tc:"#222",r:.62,z:56},
  Pb:{c:"#575961",tc:"#fff",r:.56,z:82}, Se:{c:"#ffa100",tc:"#222",r:.54,z:34}, Te:{c:"#d47a00",tc:"#fff",r:.58,z:52}, Au:{c:"#ffd123",tc:"#222",r:.52,z:79}, Ge:{c:"#668f8f",tc:"#fff",r:.50,z:32}
};
function elc(e){ return (EL[e]||{c:"#9aa"}).c; }
function eltc(e){ return (EL[e]||{tc:"#fff"}).tc; }
function elr(e){ return (EL[e]||{r:.45}).r; }
var SUP={"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻"};
var SUB={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"};
function chg(q){ if(!q) return ""; var a=Math.abs(q); return (a>1?String(a).split("").map(function(c){return SUP[c];}).join(""):"")+(q>0?"⁺":"⁻"); }
function sub(n){ return n>1?String(n).split("").map(function(c){return SUB[c];}).join(""):""; }
function ionTxt(el,q){ return el+chg(q); }

// ---------- อะตอมแบบชั้นพลังงาน (ป้ายลอย) ----------
// cx,cy หน่วยแบบจำลอง; cfg เช่น [2,8,1]; o: {lose:n, gain:n, u:0..1, scale, charge, label, protons, evCol}
function bohr(R,cx,cy,el,cfg,o){
  o=o||{}; var s=(o.scale||1)*R.sc, C=R.B(cx,cy), n=cfg.length, rr=function(k){return s*(0.42+0.36*k);};
  var u=o.u||0, lose=o.lose||0, gain=o.gain||0, col=o.ecol||"#ffe37a", gcol=o.gcol||"#7cf0ff";
  ctx.save();
  // ชั้นพลังงาน
  for(var k=0;k<n;k++){
    var fade=(lose&&k===n-1&&cfg[k]===lose)?1-0.75*u:1;
    ctx.strokeStyle="rgba(170,190,255,"+(0.45*fade)+")"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(C.x,C.y,rr(k+1),0,7); ctx.stroke();
  }
  if(gain&&cfg[n-1]+gain>8){} // ไม่ใช้
  // นิวเคลียส
  var g=ctx.createRadialGradient(C.x-s*0.12,C.y-s*0.12,s*0.05,C.x,C.y,s*0.36);
  g.addColorStop(0,shade(elc(el),0.5)); g.addColorStop(1,shade(elc(el),-0.3)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(C.x,C.y,s*0.36,0,7); ctx.fill();
  txt(C.x,C.y-s*0.08,el,eltc(el),Math.max(11,s*0.24)/bigK());
  if(o.protons) txt(C.x,C.y+s*0.16,o.protons+"p⁺",eltc(el),Math.max(9,s*0.15)/bigK(),"center",600);
  // อิเล็กตรอน
  var t0=(o.spin===false)?0:Date.now()/4000;
  for(var k=0;k<n;k++){
    var cnt=cfg[k], r=rr(k+1);
    for(var i=0;i<cnt;i++){
      var a=t0*(1+0.15*k)+i*2*Math.PI/cnt+(k*0.4), x=C.x+r*Math.cos(a), y=C.y+r*Math.sin(a), al=1, cc=col;
      if(k===n-1&&lose&&i<lose){ var d=r+u*s*2.2; x=C.x+d*Math.cos(a); y=C.y+d*Math.sin(a); al=1-u*0.45; }
      ctx.globalAlpha=al; dot(x,y,Math.max(2.5,s*0.07),cc); ctx.globalAlpha=1;
    }
  }
  if(gain){
    var k2=n-1, r2=rr(k2+1), tot=cfg[k2]+gain;
    for(var j=0;j<gain;j++){

"<h2>วงรอบที่ 1 (โหมดวัดพันธะ)</h2><ol><li><b>ขั้นที่ 3:</b> อีเทน (C–C) เอทีน (C=C) เอไทน์ (C≡C) และ N₂ พันธะที่จะวัดมีวงสีฟ้า กด ① แล้วแตะพันธะเพื่อดูไม้บรรทัดและความยาว กด ② เปิดพลังงานพันธะตามตาราง ก.1 ความยาวพันธะในภาพเป็นสัดส่วนตามค่าจริง</li>",
"<li><b>บัตรที่ 1:</b> ใช้ปุ่ม \"วางเรียงกัน\" เมทานอล (C–O 143 pm) กับอีเทน (C–C 154 pm)</li><li><b>ข้อ 4.3 ครูฉาย:</b> เปิดลิงก์ C–C C=C C≡C เรียงกันคู่กับแบบจำลองสปริง ย้ำว่าเปลวไฟเชื่อมร้อนไม่ได้เกิดจากพันธะ C≡C แข็งแรง</li><li><b>ข้อ 5.1:</b> H₂O₂ (O–O 148 pm, 144 kJ/mol) และ O₂ (O=O 121 pm, 498 kJ/mol)</li></ol>",
"<h2>วงรอบที่ 2 (โหมดเรโซแนนซ์)</h2><ol><li><b>ข้อ 3.2:</b> O₃ CO₃²⁻ NO₃⁻ เบนซีน ก่อนกด ① เกมแสดงโครงสร้างลิวอิสแบบเดียว กด ① เกมสลับแสดงโครงสร้างทุกแบบ กด ② ซ้อนเป็นลูกผสม (เส้นประคือพันธะที่อิเล็กตรอนกระจาย) พร้อมความยาวพันธะ 128 129 124 และ 139 pm</li>",
"<li><b>ข้อ 4.3 ครูฉาย:</b> เปิดลิงก์ลูกผสมของ CO₃²⁻ (เริ่มที่โครงสร้าง 3 แบบ) คู่กับเปลือกหอยหรือหินปูน แล้วกด ②</li></ol>",
"<h2>ชั่วโมงที่ 3 (โหมดสลายและสร้างพันธะ)</h2><ol><li><b>ขั้นที่ 3:</b> 4 ปฏิกิริยา กด ① โมเลกุลแยกเป็นอะตอมพร้อมแถบสีส้มขาขึ้น กด ② อะตอมรวมเป็นผลิตภัณฑ์พร้อมแถบสีฟ้าขาลงและ ΔH ทุกค่าคำนวณจากตาราง ก.2 ตรงกับเฉลยใบกิจกรรมที่ 7.3</li>",
"<li><b>บัตรข้อมูล:</b> N₂ + O₂ → 2NO ได้ +183 kJ</li><li><b>ข้อ 4.2 ครูฉาย:</b> เปิดลิงก์การเผาไหม้มีเทน (เริ่มที่การสลายพันธะ) วางคู่กับเปลวไฟเตาแก๊สชีวภาพ</li><li><b>ข้อ 5.1:</b> การเผาไหม้โพรเพน −2,034 kJ</li></ol>",
"<h2>ด่านท้าทายและรหัสผล</h2><p>อักษรนำ U = วัดพันธะ V = เรโซแนนซ์ W = สลายและสร้างพันธะ ความยาวและพลังงานพันธะทุกค่าในด่านท้าทายมาจากตาราง ก.1 และ ก.2 ของแผนที่ 7</p>",
"<table><tr><th>ด่าน</th><th>ข้อ</th></tr><tr><td>วัดพันธะ</td><td>N≡N/C≡C (สั้นกว่า), O=O/C=C, N≡N/C≡C (แข็งแรงกว่า), N≡N/C=C, N≡N/O=O, O–O/C–C/C=C</td></tr><tr><td>เรโซแนนซ์</td><td>CH₃COO⁻ HCO₃⁻ HCOO⁻ CH₃COOH CH₂O O₂ (SO₂ และ NO₂⁻ อยู่ในใบกิจกรรมที่ 7.2 จึงไม่ใช้ซ้ำ)</td></tr><tr><td>สลายและสร้างพันธะ</td><td>2H₂O₂ → 2H₂O + O₂, 2NH₃ → N₂ + 3H₂, H₂ + O₂ → H₂O₂, 2HCl → H₂ + Cl₂, C₂H₆ → C₂H₄ + H₂, 2NO → N₂ + O₂</td></tr></table>"].join(""),
en:["<h2>Before class</h2><ol>"+HOST_EN+"</ol><h2>Overview</h2><p>Cycle 1 (measure): ethane, ethene, ethyne and N₂; tap the outlined bond, then ② energy (table A.1). Card 1: methanol vs ethane. 5.1: H₂O₂ and O₂.</p>",
"<p>Cycle 2 (resonance): O₃, CO₃²⁻, NO₃⁻, benzene; ① cycles through the structures, ② shows the hybrid with lengths.</p><p>Hour 3 (break and make): four reactions from table A.2; card: N₂ + O₂ → 2NO (+183 kJ); 5.1: propane (−2,034 kJ).</p>",
"<h2>Challenges</h2><p>Code letters: U = measure, V = resonance, W = break and make.</p>"].join("")
};

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"));});
  ["langBtn1","langBtn2","langBtn3","langBtn4"].forEach(function(id){var b=document.getElementById(id);if(b)b.textContent=lang==="th"?"EN":"ไทย";});
  document.title=t("title");
  renderHome();
}
function toggleLang(){ lang=lang==="th"?"en":"th"; try{localStorage.setItem("chemar_lang",lang);}catch(e){} applyLang(); rerender(); }
function rerender(){
  if(cur.screen==="picker") showPicker(cur.mode);
  else if(cur.screen==="viewer") renderSheet();
  else if(cur.screen==="summary") showSummary();
  else if(cur.screen==="teacher") tTab(cur.ttab||"guide");
}
function renderHome(){
  var h="";
  G.order.forEach(function(m){var M=G.modes[m]; if(M.noPicker) return;
    h+="<button class='card mode' style='--mc:"+M.color+"' onclick=\"go('m-"+m+"')\"><b>"+L(M.title)+"</b><span>"+L(M.desc)+"</span></button>";});
  G.order.forEach(function(m){var M=G.modes[m];if(!M.challenge)return;
    h+="<button class='card ch' onclick=\"go('ch-"+m+"')\"><b>"+chTitle(m)+"</b><span>"+t("chDesc").replace("6",M.challenge.items.length)+(M.chWhen?" · "+L(M.chWhen):"")+"</span></button>";});
  h+="<button class='card tc' onclick=\"go('teacher')\"><b>"+t("teacherTitle")+"</b><span>"+t("teacherDesc")+"</span></button>";
  var el=document.getElementById("homeCards"); if(el) el.innerHTML=h;
}

var cur={screen:"home",mode:G.order[0],list:[],idx:0,compare:null,ctx:null,ch:null,ttab:"guide",S:null};
function show(id){ document.querySelectorAll(".screen").forEach(function(s){s.classList.toggle("show",s.id===id);}); cur.screen=id; }
function go(h){ if(location.hash==="#"+h) route(); else location.hash=h; }
function route(){
  var h=decodeURIComponent((location.hash||"").replace("#",""));
  stopCam();
  var m;
  if((m=/^m-(\w+)$/.exec(h))&&G.modes[m[1]]&&!G.modes[m[1]].noPicker){showPicker(m[1]);return;}
  if((m=/^ch-(\w+)$/.exec(h))&&G.modes[m[1]]&&G.modes[m[1]].challenge){startChallenge(m[1]);return;}
  if(h==="teacher"){show("teacher");tTab(cur.ttab||"guide");return;}
  if((m=/^t-(\w+)$/.exec(h))&&G.views&&G.views[m[1]]){var V=G.views[m[1]];
    if(V.ids.length>1) openCompare(V.mode,V.ids,V.ctx); else openViewer(V.mode,V.ids,0,V.ctx); return;}

// ---------- การสัมผัส ----------
var ptrs={},pinch0=null,tap0=null,lastTap=0;
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z:view.zoom};tap0=null;}
  else tap0={x:e.clientX,y:e.clientY,t:Date.now()};
});
cv.addEventListener("pointermove",function(e){
  var p=ptrs[e.pointerId];if(!p)return; var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch0){ptrs[e.pointerId]={x:e.clientX,y:e.clientY};var a=ptrs[ids[0]],b=ptrs[ids[1]];
    view.zoom=Math.max(0.4,Math.min(3,pinch0.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d));return;}
  var dx=e.clientX-p.x,dy=e.clientY-p.y;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(tap0&&Math.hypot(e.clientX-tap0.x,e.clientY-tap0.y)>8) tap0=null;
  if(!tap0&&!MODE().noRotate){view.R=mmul(mmul(rotY(dx*0.01),rotX(dy*0.01)),view.R);}
});
function endPtr(e){
  delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinch0=null;
  if(tap0&&Date.now()-tap0.t<350){var r=cv.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top);}
  tap0=null;
}
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",function(e){delete ptrs[e.pointerId];pinch0=null;tap0=null;});
cv.addEventListener("wheel",function(e){e.preventDefault();view.zoom=Math.max(0.4,Math.min(3,view.zoom*(e.deltaY<0?1.08:0.93)));},{passive:false});
function handleTap(x,y){
  var nowT=Date.now();
  if(nowT-lastTap<300){var a=view.ax,b=view.ay;resetView();if(camOn){view.ax=a;view.ay=b;}lastTap=0;return;}
  lastTap=nowT;
  var M=MODE();
  if(M.tap&&cur.S.hits.length){
    var best=null,bd=1e9; cur.S.hits.forEach(function(h){var d=Math.hypot(h.x-x,h.y-y);if(d<h.r&&d<bd){bd=d;best=h;}});
    if(best){ var o=curObjs()[0]; if(M.tap(o,cur.S,cur.S.x[o.id],best.d)!==false){ renderSheet(); return; } }
  }
  if(camOn){view.ax=x/W;view.ay=y/H;}
}

// ---------- กล้อง AR ----------
var camOn=false,stream=null;
function toast(s,ms){var el=document.getElementById("toast");el.textContent=s;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display="none";},ms||3500);}
function toggleCam(){ if(camOn){stopCam();return;} startCam(); }
function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(t("camFail"),6000);return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(s){
    stream=s;var v=document.getElementById("cam");v.srcObject=s;v.style.display="block";v.play().catch(function(){});
    camOn=true;document.getElementById("viewer").classList.add("cam");document.getElementById("arBtn").classList.add("on");
    toast(t("camOn"),4500);
  }).catch(function(){toast(t("camFail"),6000);});
}
function stopCam(){
  if(stream){stream.getTracks().forEach(function(tr){tr.stop();});stream=null;}
  camOn=false;var v=document.getElementById("cam");if(v){v.style.display="none";v.srcObject=null;}
  var vw=document.getElementById("viewer");if(vw)vw.classList.remove("cam");
  var b=document.getElementById("arBtn");if(b)b.classList.remove("on");
}
function toggleBig(){document.body.classList.toggle("bigtext");document.getElementById("bigBtn").classList.toggle("on");if(cur.screen==="viewer")renderSheet();}

// ---------- ด่านท้าทาย ----------
var CODE_ALPHA="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function codeLen(n){ return Math.max(2,Math.ceil((n||6)/5)); }
function letterOff(l){ var s=0; for(var i=0;i<l.length;i++) s+=l.charCodeAt(i)*5; return s%32; }
function makeCode(letter,mask,n){
  var k=codeLen(n),body=""; for(var i=k-1;i>=0;i--) body+=CODE_ALPHA[Math.floor(mask/Math.pow(32,i))%32];
  return letter+"-"+body+CODE_ALPHA[(mask*7+letterOff(letter))%32];
}
function readCodeFor(m,s){
  var M=G.modes[m],n=M.challenge.items.length,k=codeLen(n),re=new RegExp("^"+M.letter+"\\s*-?\\s*([0-9A-Z]{"+(k+1)+"})$"),r=re.exec((s||"").toUpperCase().trim()); if(!r) return null;
  var mask=0; for(var i=0;i<k;i++){ var v=CODE_ALPHA.indexOf(r[1][i]); if(v<0) return null; mask=mask*32+v; }
  if(mask>=Math.pow(2,n)) return null;
  if(makeCode(M.letter,mask,n)!==M.letter+"-"+r[1]) return null;
  return {letter:M.letter,mask:mask,mode:m};
}
function readCode(s){ for(var i=0;i<G.order.length;i++){ var m=G.order[i]; if(!G.modes[m].challenge) continue; var r=readCodeFor(m,s); if(r) return r; } return null; }
function modeOfLetter(l){ for(var i=0;i<G.order.length;i++){ if(G.modes[G.order[i]].letter===l) return G.order[i]; } return null; }
function startChallenge(mode){
  var C=G.modes[mode].challenge;
  cur.mode=mode;cur.compare=null;cur.list=C.items.map(function(it){return it.id;});cur.idx=0;
  cur.ch={mode:mode,answers:[],picked:null};cur.ctx={ch:true};
  chPrepare(); show("viewer");resize();renderSheet();
}
function chItem(){ return G.modes[cur.ch.mode].challenge.items[cur.idx]; }
function chPrepare(){ var C=G.modes[cur.ch.mode].challenge,it=chItem(); resetState(); if(it.x){ for(var k in it.x) cur.S.x[it.id][k]=it.x[k]; } setStageRaw(it.stage0!==undefined?it.stage0:(C.stage0||0)); }
function chOpts(it){ var C=G.modes[cur.ch.mode].challenge; return it.opts||C.opts; }
function optLabel(op){ return L(op); }
function renderChallengeSheet(){
  var C=G.modes[cur.ch.mode].challenge,it=chItem(),o=G.objs[it.id],h="";
  h+="<div class='row'><span class='progress'>"+t("q")+" "+(cur.idx+1)+" "+t("of")+" "+C.items.length+"</span> · <b style='font-size:20px'>"+(it.title?L(it.title):(o.f||o.id))+"</b></div>";
  h+="<div class='info'>"+L(it.q||C.q)+"</div>";
  if(it.hint) h+="<div class='hint'>"+t("helper")+": "+L(it.hint)+"</div>";
  h+="<div class='opts'>";
  chOpts(it).forEach(function(op){
    var cls=""; if(cur.ch.picked!==null){ if(op.k===it.ans) cls="right"; else if(op.k===cur.ch.picked) cls="wrongpick"; }
    h+="<button class='"+cls+"' "+(cur.ch.picked!==null?"disabled":"")+" onclick=\"chPick('"+op.k+"')\">"+optLabel(op)+"</button>";
  });
  h+="</div>";
  if(cur.ch.picked!==null){
    var ok=cur.ch.picked===it.ans,ansOp=chOpts(it).filter(function(op){return op.k===it.ans;})[0];
    h+="<div class='fb "+(ok?"ok":"no")+"'><b>"+(ok?t("right"):t("wrong"))+"</b> · "+t("answerIs")+" "+optLabel(ansOp)+"<br>"+L(it.why)+"</div>";
    h+="<div class='row'>"+tog("spin",t("spin"))+"<button class='primary' onclick='chNext()'>"+(cur.idx<C.items.length-1?t("next"):t("finish"))+"</button></div>";
  }
  document.getElementById("sheet").innerHTML=h;
}
function chPick(k){
  var C=G.modes[cur.ch.mode].challenge,it=chItem();
  cur.ch.picked=k;cur.ch.answers[cur.idx]=(k===it.ans);
  setStageRaw(it.stage!==undefined?it.stage:(C.stage!==undefined?C.stage:nStages()));
  renderSheet();
}
function chNext(){
  var C=G.modes[cur.ch.mode].challenge;
  if(cur.idx<C.items.length-1){cur.idx++;cur.ch.picked=null;chPrepare();renderSheet();}
  else{stopCam();showSummary();}
}
function chResult(){
  var M=G.modes[cur.ch.mode],C=M.challenge,mask=0,score=0,wrong=[];
  C.items.forEach(function(it,i){if(cur.ch.answers[i])score++;else{mask+=Math.pow(2,i);wrong.push(it.title?L(it.title):F(it.id));}});
  return {score:score,total:C.items.length,wrong:wrong,code:makeCode(M.letter,mask,C.items.length)};
}
function formUrl(){
  var u=FORM_URL;
  try{var q=new URLSearchParams(location.search).get("form");if(q)u=q;}catch(e){}
  if(!u){try{u=localStorage.getItem("chemar_form")||"";}catch(e){}}
  return /^https:\/\//.test(u)?u:"";
}
function showSummary(){
  show("summary");
  var r=chResult(),fu=formUrl(),title=chTitle(cur.ch.mode);
  var h="<div class='topbar'><button onclick=\"go('home')\">"+t("home")+"</button><button class='ghost' onclick='toggleLang()'>"+(lang==="th"?"EN":"ไทย")+"</button></div>";
  h+="<h1>"+t("sumTitle")+"</h1><p class='sub'>"+t("title")+" · "+title+"</p>";
  h+="<h2>"+t("score")+": "+r.score+"/"+r.total+"</h2>";
  h+="<h3>"+t("wrongList")+"</h3><p>"+(r.wrong.length?r.wrong.join(" · "):t("allRight"))+"</p>";
  h+="<h3>"+t("yourCode")+"</h3><div class='code' id='codeBox'>"+r.code+"</div><div class='row' style='display:flex;gap:8px;flex-wrap:wrap'><button onclick='copyCode()'>"+t("copy")+"</button>"+
     (fu?"<a href='"+fu.replace(/'/g,"%27")+"' target='_blank' rel='noopener'><button class='primary'>"+t("openForm")+"</button></a>":"")+"</div>";
  if(!fu) h+="<p class='note'>"+t("noForm")+"</p>";
  h+="<h3>"+t("certName")+"</h3><input id='certName' maxlength='60'><div style='margin-top:8px;display:flex;gap:8px;flex-wrap:wrap'><button class='primary' onclick='makeCert()'>"+t("makeCert")+"</button><button id='saveBtn' style='display:none' onclick='saveCert()'>"+t("saveCert")+"</button></div>";
  h+="<img id='certImg' alt=''><p class='note' id='saveNote' style='display:none'>"+t("saveHint")+"</p>";
  h+="<div style='margin-top:16px'><button onclick=\"startChallenge('"+cur.ch.mode+"')\">"+t("retry")+"</button></div>";
  h+="<div class='credit'>"+t("creditLabel")+" <b>"+t("creditName")+"</b></div>";
  document.getElementById("sumWrap").innerHTML=h;
}
function copyCode(){ var c=chResult().code; try{navigator.clipboard.writeText(c).then(function(){toastS(t("copied"));},function(){toastS(t("copyFail"));});}catch(e){toastS(t("copyFail"));} }
function toastS(s){var b=document.getElementById("codeBox");if(!b)return;var n=document.createElement("div");n.className="note";n.textContent=s;b.parentNode.insertBefore(n,b.nextSibling);setTimeout(function(){n.remove();},2500);}
var certURL=null,certBlob=null;
function makeCert(){
  var r=chResult(),M=G.modes[cur.ch.mode],name=(document.getElementById("certName").value||"").trim()||"…………………………";
  var c=document.createElement("canvas");c.width=1400;c.height=990;var g=c.getContext("2d"),Fn=FONT();
  var bg=g.createLinearGradient(0,0,1400,990);bg.addColorStop(0,"#fffaf0");bg.addColorStop(1,"#f3ecff");g.fillStyle=bg;g.fillRect(0,0,1400,990);
  g.strokeStyle=M.color;g.lineWidth=22;g.strokeRect(30,30,1340,930);
  g.strokeStyle="#c9a227";g.lineWidth=4;g.strokeRect(62,62,1276,866);
  g.fillStyle="#1d2550";g.textAlign="center";
  g.font="800 78px "+Fn;g.fillText(t("certTitle"),700,190);
  g.font="500 34px "+Fn;g.fillText(t("certGive"),700,270);
  g.font="800 64px "+Fn;g.fillStyle="#3a2a9a";g.fillText(name,700,370);
  g.fillStyle="#1d2550";g.font="500 36px "+Fn;g.fillText(t("certFor")+" "+chTitle(cur.ch.mode),700,460);
  g.font="700 40px "+Fn;g.fillText(t("title"),700,525);
  g.font="700 46px "+Fn;g.fillStyle=shade(M.color,-0.35);g.fillText(t("certScore")+" "+r.score+"/"+r.total,700,610);
  g.fillStyle="#555";g.font="500 28px "+Fn;
  var d=new Date();g.fillText((lang==="en"?d.toLocaleDateString("en-GB"):d.toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"})),700,680);
  g.font="500 26px "+Fn;g.fillText(t("creditLabel")+" "+t("creditName"),700,860);
  certURL=c.toDataURL("image/png");
  var img=document.getElementById("certImg");img.src=certURL;img.style.display="block";
  document.getElementById("saveBtn").style.display="inline-block";document.getElementById("saveNote").style.display="block";
  c.toBlob(function(b){certBlob=b;},"image/png");
}
var dlNS=null;
try{ if(window.claude&&window.claude.use){ window.claude.use("downloads").then(function(ns){dlNS=ns;}).catch(function(){}); } }catch(e){}
function saveFile(name,blob,fallbackUrl){
  if(dlNS){dlNS.save({filename:name,data:blob}).catch(function(){});return;}
  try{var a=document.createElement("a");a.href=fallbackUrl||URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
}
function saveCert(){ if(certBlob) saveFile("certificate-"+G.id+"-"+cur.ch.mode+".png",certBlob,certURL); }

// ---------- หน้าครู ----------
function tTab(k){
  cur.ttab=k;["guide","links","decode","form"].forEach(function(x){var b=document.getElementById("tb-"+x);if(b)b.classList.toggle("on",x===k);});
  var el=document.getElementById("tBody");
  if(k==="guide") el.innerHTML="<div class='guide'>"+L(G.guide)+"</div>";
  if(k==="links"){
    var base=location.href.split("#")[0];
    var stu=[]; G.order.forEach(function(m){if(G.modes[m].noPicker)return;stu.push(["m-"+m,L(G.modes[m].title)+" · "+L(G.modes[m].linkNote||"")]);});
    G.order.forEach(function(m){if(G.modes[m].challenge) stu.push(["ch-"+m,chTitle(m)+(G.modes[m].chWhen?" · "+L(G.modes[m].chWhen):"")]);});
    var tv=[]; for(var key in (G.views||{})) tv.push(["t-"+key,L(G.views[key].label)]);
    var groups=[[t("lkStudents"),stu]]; if(tv.length) groups.push([t("lkTeacherScreen"),tv]); groups.push([t("lkOther"),[["teacher",t("lkTeacher")]]]);
    var h="<p class='note'>"+t("linksNote")+"</p>",n=0;
    groups.forEach(function(g){ h+="<h2>"+g[0]+"</h2>";
      g[1].forEach(function(r){var i=n++,u=base+"#"+r[0];
        h+="<div><b>"+r[1]+"</b></div><div class='linkrow'><code id='lk"+i+"'>"+u+"</code><button class='primary' onclick=\"go('"+r[0]+"')\">"+t("openNow")+"</button><button onclick=\"copyTxt('lk"+i+"')\">"+t("copyLink")+"</button></div>";});});
    el.innerHTML=h;
  }
  if(k==="decode"){
    var ex=G.order.filter(function(m){return G.modes[m].challenge;}).map(function(m){return makeCode(G.modes[m].letter,5,G.modes[m].challenge.items.length);}).join("  ");
    el.innerHTML="<p class='note'>"+t("decodeHint")+"</p><textarea id='codesIn' rows='7' placeholder='"+ex+" …'></textarea><div style='margin:8px 0'><button class='primary' onclick='decodeAll()'>"+t("decodeBtn")+"</button></div><div id='decOut'></div>";
  }
  if(k==="form"){
    var cu="";try{cu=localStorage.getItem("chemar_form")||"";}catch(e){}
    el.innerHTML="<h3>"+t("formLabel")+"</h3><input id='formIn' placeholder='https://forms.gle/…' value='"+cu.replace(/'/g,"&#39;")+"'><div style='margin:8px 0'><button onclick='saveFormUrl()'>"+t("saveForm")+"</button></div><p class='note'>"+t("formNote")+"</p>"+
      "<h3>"+t("dlGame")+"</h3><button class='primary' onclick='dlGame()'>"+t("dlGame")+"</button><p class='note'>"+t("dlNote")+"</p>";
  }
}
function copyTxt(id){var s=document.getElementById(id).textContent;try{navigator.clipboard.writeText(s).catch(function(){});}catch(e){}
  var r=document.createRange();r.selectNodeContents(document.getElementById(id));var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}
function saveFormUrl(){try{localStorage.setItem("chemar_form",document.getElementById("formIn").value.trim());}catch(e){}}
function dlGame(){
  var html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  html=html.replace(/<div id="tBody">[\s\S]*?<\/div>\s*<div class="credit">/,'<div id="tBody"></div>\n  <div class="credit">');
  html=html.replace(/<div class="screen show"/g,'<div class="screen"').replace(/ class="([^"]*)\bshow\b/g,' class="$1');
  saveFile(G.file,new Blob([html],{type:"text/html"}));
}
function decodeAll(){
  var toks=(document.getElementById("codesIn").value||"").toUpperCase().match(/[A-Z]{1,2}\s*-?\s*[0-9A-Z]{3,6}/g)||[];
  var tally={},bad=0,other=0;
  toks.forEach(function(s){var r=readCode(s);if(!r){bad++;return;}var m=r.mode,n=G.modes[m].challenge.items.length;
    var T=tally[m]||(tally[m]={n:0,w:new Array(n).fill(0)});T.n++;for(var i=0;i<n;i++)if(Math.floor(r.mask/Math.pow(2,i))%2)T.w[i]++;});
  var tot=0;for(var m in tally)tot+=tally[m].n;
  var h="<p>"+t("valid")+": <b>"+tot+"</b> · "+t("invalid")+": <b>"+bad+"</b>"+(other?" · "+t("otherGame")+": <b>"+other+"</b>":"")+"</p>";
  G.order.forEach(function(m){var T=tally[m];if(!T)return;var C=G.modes[m].challenge;
    h+="<h3>"+chTitle(m)+" (n = "+T.n+")</h3><table><tr><th>"+t("item")+"</th><th>"+t("nWrong")+"</th><th>"+t("pct")+"</th></tr>";
    var order=C.items.map(function(x,i){return i;}).sort(function(a,b){return T.w[b]-T.w[a];});
    order.forEach(function(i){var pc=Math.round(T.w[i]/T.n*1000)/10,it=C.items[i];
      h+="<tr class='"+(pc>30?"hot":"")+"'><td>"+(i+1)+". "+(it.title?L(it.title):F(it.id))+"</td><td>"+T.w[i]+"</td><td>"+pc+"%"+(pc>30?" · "+t("hot"):"")+"</td></tr>";});
    h+="</table>";});
  document.getElementById("decOut").innerHTML=h;
}
