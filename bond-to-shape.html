<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>จากพันธะสู่รูปร่าง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Charm:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dark lab bench is the stage; light notebook panels sit around it. Model-kit (CPK) atom colours and amber electrons carry the identity. */
:root{
  --paper:#ECF0F2; --sheet:#FFFFFF; --ink:#17212B; --muted:#56656F; --rule:#CBD4DB; --rule-soft:#E0E6EA;
  --accent:#E89A00; --accent-ink:#8A5600; --accent-soft:#FFF0CC; --on-accent:#1E1400;
  --ok:#1D7748; --ok-soft:#DCF1E4; --bad:#B42F2E; --bad-soft:#FAE2E1;
  --bench:#1B252F; --bench-2:#243140; --bench-ink:#E6EDF2; --bench-muted:#8FA2B2; --electron:#FFB627;
  --display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161B; --sheet:#172028; --ink:#E3EAF0; --muted:#98A8B5; --rule:#2B3743; --rule-soft:#222C35;
  --accent:#FFB627; --accent-ink:#FFC85C; --accent-soft:#33270C; --on-accent:#1E1400;
  --ok:#5BCB8D; --ok-soft:#14301F; --bad:#FF807C; --bad-soft:#3A1817;
  --bench:#0D1318; --bench-2:#18232D; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10161B; --sheet:#172028; --ink:#E3EAF0; --muted:#98A8B5; --rule:#2B3743; --rule-soft:#222C35;
  --accent:#FFB627; --accent-ink:#FFC85C; --accent-soft:#33270C; --on-accent:#1E1400;
  --ok:#5BCB8D; --ok-soft:#14301F; --bad:#FF807C; --bad-soft:#3A1817;
  --bench:#0D1318; --bench-2:#18232D; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
sub{font-size:.62em;vertical-align:-.28em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.05rem;background:none;border:0;padding:0}
.brand svg{width:40px;height:22px}
.topr{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--sheet);gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:12px 20px;font-size:1rem;border-radius:10px}

/* level rail */
.rail{padding-block:12px 10px;border-bottom:1px solid var(--rule)}
.rail-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.rail-msg{font-family:var(--display);font-weight:600;font-size:1rem}
.rail-count{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-bar{height:6px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin:8px 0 10px}
.rail-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent));border-radius:99px;transition:width .5s}
.rail-track{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rg{display:flex;flex-direction:column;gap:4px;flex:none}
.rg-l{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rg-n{display:flex;gap:5px}
.rn{width:66px;border:1px solid var(--rule);background:var(--sheet);border-radius:9px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;line-height:1.15;flex:none}
.rn:hover{border-color:var(--ink)}
.rn .n{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.rn .f{font-family:var(--display);font-weight:700;font-size:.95rem}
.rn .s{font-size:.6rem;color:var(--accent);letter-spacing:1px;min-height:.8rem}
.rn .s .off{color:var(--rule)}
.rn.done{background:var(--ok-soft);border-color:var(--ok)}
.rn.done .n{color:var(--ok)}
.rn.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.rn.next{border-style:dashed;border-color:var(--accent)}
.praise{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.3;color:var(--ok);margin:4px 0 6px;text-wrap:balance}
.finale{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-top:10px}
.finale b{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.35}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-block:44px 36px}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.8rem);font-weight:700;letter-spacing:-.01em;margin-top:10px}
.hero h1 .en{display:block;font-size:.42em;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.hero p.lead{font-size:1.08rem;max-width:56ch;margin:16px 0 22px;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:.82rem;color:var(--muted)}
.showcase{background:var(--bench);border-radius:16px;padding:18px;color:var(--bench-ink);
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.sc-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sc-row svg{width:100%;height:190px}
.sc-row canvas{width:100%;height:190px;display:block}
.sc-arrow{font-family:var(--mono);color:var(--electron);font-size:1.4rem}
.sc-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--bench-muted);letter-spacing:.06em;text-transform:uppercase}
.sc-cap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}
.sc-cap .f{font-family:var(--display);font-size:1.5rem;font-weight:700}
.sc-cap .axe{font-family:var(--mono);color:var(--electron)}

/* sections */
section.block{padding-block:28px}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sechead h2{font-size:1.6rem}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;list-style:none;margin:0;padding:0;counter-reset:h}
.howto li{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;counter-increment:h;min-width:0}
.howto li::before{content:counter(h);font-family:var(--mono);font-weight:600;color:var(--accent-ink);display:block;font-size:.85rem;margin-bottom:4px}
.chap{margin-bottom:26px}
.chap h3{font-size:1.15rem;display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.chap h3 .eyebrow{font-size:.7rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.tile{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px 12px;min-height:132px;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--ink)}
.tile .go{position:absolute;inset:0;border:0;background:none;border-radius:var(--r)}
.tile .num{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.tile .f{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1}
.tile .nm{font-size:.86rem;color:var(--muted)}
.tile .shape{font-size:.82rem;color:var(--ok);font-weight:600;margin-top:auto}
.tile .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px}
.stars{color:var(--accent);letter-spacing:1px;font-size:.95rem}
.stars .off{color:var(--rule)}
.tile .cert{position:relative;z-index:1;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;font-size:.74rem;padding:2px 8px;font-weight:600}
.tile .cert:hover{border-color:var(--accent);color:var(--accent-ink)}
.tile.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--rule))}
.grandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r);padding:12px 16px}
.vtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcell{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px 12px;min-width:0}
.vcell canvas{width:100%;height:120px;display:block;background:var(--bench);border-radius:8px}
.vcell .axe{font-family:var(--mono);font-weight:600;color:var(--accent-ink);margin-top:8px}
.vcell .nm{font-weight:600;line-height:1.3}
.vcell .en{font-size:.8rem;color:var(--muted)}
.vcell .meta{font-size:.82rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.vnote{font-size:.9rem;color:var(--muted);max-width:70ch;margin:0 0 14px}

/* play */
.playbar{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--rule)}
.pl-title{display:flex;flex-direction:column;min-width:0}
.pl-title h2{font-size:2rem;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pl-title h2 small{font-family:var(--body);font-size:1rem;font-weight:500;color:var(--muted)}
.stepper{display:flex;gap:6px;list-style:none;margin:0 0 0 auto;padding:0;flex-wrap:wrap}
.stepper li{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);background:var(--sheet)}
.stepper li.now{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.stepper li.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.plscore{font-family:var(--mono);font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plscore b{color:var(--ink);font-size:1.1rem}
.playgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;padding-top:16px;align-items:start}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.stagebar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bench{position:relative;background:var(--bench);border-radius:14px;color:var(--bench-ink);min-height:360px;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
.bench.solved{box-shadow:inset 0 0 0 3px var(--ok)}
.board svg{display:block;width:100%;height:auto;max-height:520px;touch-action:manipulation}
.three{position:relative}
.three canvas{display:block;width:100%;height:440px;cursor:grab;touch-action:none}
.threelab{position:absolute;left:14px;top:12px;right:14px;pointer-events:none;font-size:.86rem;display:flex;flex-direction:column;gap:2px}
.threelab .big{font-family:var(--display);font-size:1.25rem;font-weight:700}
.threelab .mono{font-family:var(--mono);color:var(--electron)}
.threelab .leg{color:var(--bench-muted);font-size:.78rem}
.benchhint{margin:0;padding:0 14px 12px;font-size:.82rem;color:var(--bench-muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .spacer{flex:1}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:1.05rem;margin-bottom:8px}
.card .lbl{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.meter{height:10px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.meter.over i{background:var(--bad)}
.brow{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;font-size:.9rem;flex-wrap:wrap}
.brow b{font-family:var(--mono)}
.sum{font-family:var(--mono);font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px}
.sum b{color:var(--ink)}
.ech{display:inline-flex;align-items:center;gap:6px;background:var(--bench);color:var(--bench-ink);border-radius:999px;padding:2px 10px 2px 6px;font-weight:600}
.ech i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.plus{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px 3px 4px;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:.72rem;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip.ok{border-color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);background:var(--bad-soft)}
.mini{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.mini .mv{grid-column:1/-1;background:var(--bench);border-radius:10px}
.mini .mv svg{display:block;width:100%;height:150px}
.legend{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.task ol.method{margin:6px 0 10px;padding-left:1.2em;font-size:.9rem}
.task ol.method li{margin-bottom:3px}
.fb{border-radius:8px;padding:10px 12px;font-size:.92rem;margin-top:10px}
.fb.bad{background:var(--bad-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent)}
.fb.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 50%,transparent)}
.fb.info{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.fb ul{margin:4px 0 0;padding-left:1.1em}
.fb .t{font-weight:700}
.note{font-size:.9rem;background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:10px}
.note .lbl{display:block;margin-bottom:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.counter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.counter .ctl{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.counter .ctl button{border:0;background:var(--paper);width:36px;height:36px;font-size:1.1rem;font-weight:700}
.counter .ctl output{min-width:40px;text-align:center;font-family:var(--mono);font-weight:600;font-size:1.1rem}
.axe-out{font-family:var(--mono);font-size:1.6rem;font-weight:600;color:var(--accent-ink);margin:10px 0 4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.opt{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt canvas{width:100%;height:96px;display:block;background:var(--bench);border-radius:7px}
.opt .on{font-weight:600;font-size:.9rem;line-height:1.3}
.opt .oe{font-size:.76rem;color:var(--muted)}
.opt.txt{justify-content:center;min-height:52px;font-family:var(--mono);font-weight:600;font-size:1rem;text-align:center;align-items:center}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.7}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok)}
.score-break{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem;font-variant-numeric:tabular-nums;margin:8px 0}
.score-break b{font-family:var(--mono);text-align:right}
.score-break .tot{border-top:1px solid var(--rule);padding-top:6px;font-weight:700}
.bigstars{font-size:2rem;color:var(--accent);letter-spacing:4px}
.bigstars .off{color:var(--rule)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;background:var(--sheet);color:var(--ink);width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,16,22,.6)}
.dlg{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h3{font-size:1.25rem}
.certimg{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block;background:#fff}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted);min-width:0}
.form input[type=text]{font:inherit;font-size:.98rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
.form .full{grid-column:1/-1}
.sig{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig img{height:44px;max-width:160px;object-fit:contain;background:#fff;border:1px solid var(--rule);border-radius:6px}
.small{font-size:.82rem;color:var(--muted)}
footer{border-top:1px solid var(--rule);margin-top:24px;padding-top:14px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}
footer b{color:var(--ink);font-weight:600}
.dev{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:18px 0 0;font-size:.92rem}
.dev-l{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.dev-n{font-weight:700}
.dev-s{color:var(--muted)}

/* svg atoms */
.e{stroke:rgba(5,9,13,.55);stroke-width:.8}
.board .e{filter:drop-shadow(0 0 2.5px rgba(255,255,255,.28))}
.bline{stroke:var(--bench-ink);stroke-linecap:round}
.slot{stroke:var(--bench-muted);stroke-dasharray:5 6;stroke-width:2;opacity:.75}
.slotplus{fill:var(--bench-2);stroke:var(--bench-muted);stroke-width:1.5}

.hit{stroke:transparent;stroke-width:34;stroke-linecap:round}

[data-atom]:hover .acirc,[data-atom]:focus-visible .acirc{stroke:var(--electron);stroke-width:3}

.pop{animation:pop .28s ease-out;transform-box:fill-box;transform-origin:center}

<script>
/* ===== data + pure logic (no DOM) ===== */
const ELEM={
  H:{v:1,col:'#F2F4F6',txt:'#1B2530',r:22,r3:.24,ec:'#FFFFFF'},
  B:{v:3,col:'#F4A28C',txt:'#3B1A10',r:27,r3:.33,ec:'#FFB8A6'},
  C:{v:4,col:'#30363C',txt:'#FFFFFF',r:27,r3:.34,ec:'#D99BFF'},
  N:{v:5,col:'#3A5BE0',txt:'#FFFFFF',r:27,r3:.33,ec:'#62B4FF'},
  O:{v:6,col:'#E0342E',txt:'#FFFFFF',r:27,r3:.32,ec:'#FF6F61'},
  F:{v:7,col:'#8AD660',txt:'#14300F',r:26,r3:.30,ec:'#A6F27A'},
  P:{v:5,col:'#F58220',txt:'#2A1300',r:29,r3:.40,ec:'#FFA54F'},
  S:{v:6,col:'#EDC524',txt:'#2E2600',r:29,r3:.40,ec:'#FFE14D'},
  Cl:{v:7,col:'#24A247',txt:'#FFFFFF',r:28,r3:.37,ec:'#52E28E'},
  Xe:{v:8,col:'#3FB0BF',txt:'#08262A',r:30,r3:.44,ec:'#5FE6F2'}
};
/* who supplied each bonding electron: each side gives `order` electrons, shifted toward the atom with positive formal charge (coordinate bonds) */
function bondOwners(L,b,lp){
  const fc=L.atoms.map((a,i)=>ELEM[a.e].v-2*lp[i]-bondSum(L,b,i));
  return L.bonds.map(([i,j],k)=>{const c=[b[k],b[k]];
    if(fc[i]>0&&fc[j]<0){const s=Math.min(fc[i],-fc[j],c[1]);c[0]+=s;c[1]-=s;fc[i]-=s;fc[j]+=s}
    else if(fc[j]>0&&fc[i]<0){const s=Math.min(fc[j],-fc[i],c[0]);c[1]+=s;c[0]-=s;fc[j]-=s;fc[i]+=s}
    return c});
}
function pairColors(L,k,ord,c){const [i,j]=L.bonds[k];let a=c[0],bb=c[1];const out=[];
  for(let m=0;m<ord;m++){let d1,d2;if(a>0){d1=i;a--}else{d1=j;bb--}if(bb>0){d2=j;bb--}else{d2=i;a--}out.push([d1,d2])}return out}
const SHAPES={
  linear:{d:2,lp:0,th:'เส้นตรง',en:'Linear',ang:'180°',ex:'CO2'},
  trigonalPlanar:{d:3,lp:0,th:'สามเหลี่ยมแบนราบ',en:'Trigonal planar',ang:'120°',ex:'BF3'},
  bent3:{d:3,lp:1,th:'มุมงอ',en:'Bent',ang:'< 120°',ex:'SO2'},
  tetrahedral:{d:4,lp:0,th:'ทรงสี่หน้า',en:'Tetrahedral',ang:'109.5°',ex:'CH4'},
  pyramidal:{d:4,lp:1,th:'พีระมิดฐานสามเหลี่ยม',en:'Trigonal pyramidal',ang:'≈107°',ex:'NH3'},
  bent4:{d:4,lp:2,th:'มุมงอ',en:'Bent',ang:'≈104.5°',ex:'H2O'},
  tbp:{d:5,lp:0,th:'พีระมิดคู่ฐานสามเหลี่ยม',en:'Trigonal bipyramidal',ang:'90°, 120°',ex:'PCl5'},
  seesaw:{d:5,lp:1,th:'ทรงสี่หน้าบิดเบี้ยว',en:'Seesaw',ang:'< 90°, < 120°',ex:'SF4'},
  tshape:{d:5,lp:2,th:'รูปตัวที',en:'T-shaped',ang:'< 90°',ex:'ClF3'},
  linear5:{d:5,lp:3,th:'เส้นตรง',en:'Linear',ang:'180°',ex:'XeF2'},

const valenceTotal=L=>L.atoms.reduce((s,a)=>s+ELEM[a.e].v,0);
function bondSum(L,b,i){let s=0;L.bonds.forEach((bd,k)=>{if(bd[0]===i||bd[1]===i)s+=b[k]});return s}
const atomCount=(L,b,lp,i)=>2*lp[i]+2*bondSum(L,b,i);
const usedTotal=(L,b,lp)=>lp.reduce((s,x)=>s+2*x,0)+b.reduce((s,x)=>s+2*x,0);
const formalCharges=(L,b,lp)=>L.atoms.map((a,i)=>ELEM[a.e].v-2*lp[i]-bondSum(L,b,i));
function validate(L,b,lp){
  const issues=[],bad=new Set();
  L.bonds.forEach((bd,k)=>{if(b[k]===0){issues.push({k:'disc',a:bd[1]});bad.add(bd[1])}});
  const T=valenceTotal(L),U=usedTotal(L,b,lp);
  if(U>T)issues.push({k:'over',n:U-T,t:T});else if(U<T)issues.push({k:'under',n:T-U});
  L.atoms.forEach((a,i)=>{const n=atomCount(L,b,lp,i);if(n!==a.t){issues.push({k:'atom',a:i,t:a.t,n});bad.add(i)}});
  let ok=issues.length===0;
  if(ok){const fc=formalCharges(L,b,lp).reduce((s,x)=>s+Math.abs(x),0);if(fc!==L.fc){ok=false;issues.push({k:'fc'})}}
  return {ok,issues,bad};
}

  $('#railMsg').textContent=t(encKey(st.n));
  $('#railCount').textContent=t('railCount',{n:st.n,s:st.score.toLocaleString()});
  $('#railFill').style.width=(st.n/16*100)+'%';
  $('#railTrack').innerHTML=CHAPTERS.map((c,ci)=>`<div class="rg"><span class="rg-l">${t('chapter')} ${ci+1}</span><div class="rg-n">${LEVELS.map((L,i)=>{if(L.ch!==ci)return '';const p=progress[L.id];
    const cls=[p?'done':'',i===cur?'now':'',cur<0&&i===nxt?'next':''].join(' ');
    return `<button type="button" class="rn ${cls}" data-start="${i}" aria-label="${t('level')} ${i+1} ${esc(L.f)}${p?' ✓':''}"${i===cur?' aria-current="step"':''}><span class="n">${p?'✓ ':''}${String(i+1).padStart(2,'0')}</span><span class="f">${fH(L.f)}</span><span class="s">${p?[0,1,2].map(k=>k<p.stars?'★':'<span class="off">★</span>').join(''):''}</span></button>`}).join('')}</div></div>`).join('');
  const on=$('#railTrack .now')||$('#railTrack .next');if(on){const tr=$('#railTrack');tr.scrollLeft=Math.max(0,on.offsetLeft-tr.offsetLeft-tr.clientWidth/2+on.offsetWidth/2)}
}

function renderVTable(){

/* ---------- play state ---------- */
let S=null;
function startLevel(i){
  const L=LEVELS[i];
  S={i,L,b:L.bonds.map(()=>0),lp:L.atoms.map(()=>0),hist:[],mode:'add',view:'dot',tab:'lewis',step:1,fails:0,pts:{build:50,dom:20,shape:20,ang:10},
     fb:null,marks:null,hint:false,ans:false,domX:0,domE:0,domWrong:0,shapeOpts:null,shapeWrong:[],angWrong:[],angOpts:null,msg:null,hl:-1,pop:null};
  S.shapeOpts=shapeOptions(L);
  if(L.diatomic)S.angOpts=shuffle([0,1,2].map(k=>({k,label:t(['single','double','triple'][k])})));
  else S.angOpts=shuffle(L.ang.opts.map((o,k)=>({k,o})));
  $('#home').hidden=true;$('#play').hidden=false;window.scrollTo(0,0);
  renderPlay();
}
function shapeOptions(L){
  const c=L.shape,cs=SHAPES[c],nm=k=>SHAPES[k].th;
  const pool=Object.keys(SHAPES).filter(k=>k!==c&&nm(k)!==nm(c));
  const near=shuffle(pool.filter(k=>SHAPES[k].d===cs.d||(SHAPES[k].d-SHAPES[k].lp)===(cs.d-cs.lp)));
  const picks=[];for(const k of near.concat(shuffle(pool.slice()))){if(picks.length>=3)break;if(!picks.includes(k)&&!picks.some(p=>nm(p)===nm(k)))picks.push(k)}
  return shuffle([c,...picks]);
}
const total=()=>S.pts.build+S.pts.dom+S.pts.shape+S.pts.ang;
function renderPlay(){
  const L=S.L;renderRail();
  $('#plChap').textContent=`${t('level')} ${S.i+1} · ${t('chapter')} ${L.ch+1} ${tx(CHAPTERS[L.ch])}`;
  $('#plFormula').innerHTML=`${fH(L.f)} <small>${tx(L.name)}</small>`;
  const names=['st1',L.diatomic?'st2d':'st2','st3',L.diatomic?'st4d':'st4'];
  $('#stepper').innerHTML=names.map((k,j)=>`<li class="${S.step>j+1?'done':S.step===j+1?'now':''}">${j+1} ${t(k)}</li>`).join('');
  $('#plScore').innerHTML=`${t('ptsNow')} <b>${total()}</b>/100`;
  $$('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  $$('#tabSeg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.tab===S.tab);if(b.dataset.tab==='3d'){b.disabled=S.step<4;b.title=S.step<4?t('locked3d'):''}});
  $('#viewSeg').style.visibility=S.tab==='lewis'?'visible':'hidden';
  $$('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  $('#tools').hidden=S.step!==1;
  $('#fillBtn').hidden=L.ch<2;
  $('#undoBtn').disabled=!S.hist.length;
  $('#board').hidden=S.tab!=='lewis';$('#three').hidden=S.tab!=='3d';
  $('#bench').classList.toggle('solved',S.step>1);
  $('#benchHint').textContent=S.tab==='3d'?t('hint3d'):S.step>1?t('hintDone'):S.mode==='add'?t('hintAdd'):t('hintRemove');
  renderBoard();renderBudget();renderChips();renderMini();renderTask();render3DLab();
}
function renderBoard(){
  $('#board').innerHTML=svgMol(S.L,S.b,S.lp,{mode:S.view,interactive:S.step===1,marks:S.marks,hl:S.hl,pop:S.pop,minW:460,minH:300,pad:34});
  S.pop=null;
}
function renderBudget(){
  const L=S.L,T=valenceTotal(L),U=usedTotal(L,S.b,S.lp),left=T-U;
  const groups={};L.atoms.forEach(a=>{groups[a.e]=(groups[a.e]||0)+1});
  const sum=Object.entries(groups).map(([e,n])=>`<span class="ech"><i style="background:${ELEM[e].ec}"></i>${e} ${ELEM[e].v}${n>1?' ×'+n:''}</span>`).join('<span class="plus">+</span>');
  $('#budget').innerHTML=`<div class="brow"><span class="lbl">${t('budget')}</span><b>${T}</b></div><div class="sum">${sum}<span class="plus">=</span><b>${T}</b></div><p class="small" style="margin:4px 0 0">${t('ecNote')}</p>
   <div class="meter ${U>T?'over':''}"><i style="width:${Math.min(100,U/T*100)}%"></i></div>
   <div class="brow"><span>${t('placed')} <b>${U}</b></span><span>${left>=0?t('left'):t('over')} <b style="color:${left<0?'var(--bad)':left===0?'var(--ok)':'inherit'}">${Math.abs(left)}</b></span></div>`;
}
function renderChips(){
  const L=S.L;
  $('#chips').innerHTML=`<span class="lbl">${t('around')}</span><div class="chips">${L.atoms.map((a,i)=>{const n=atomCount(L,S.b,S.lp,i),mk=S.marks?S.marks[i]:'';
    return `<span class="chip ${mk||''}" data-hl="${i}"><i style="background:${ELEM[a.e].col};color:${ELEM[a.e].txt}">${a.e}</i>${i===0&&!L.diatomic?`<span class="small">${t('center')}</span> `:''}<b>${n}</b> e⁻</span>`}).join('')}</div>`;
}
function renderMini(){
  const other=S.view==='dot'?'line':'dot';
  $('#mini').innerHTML=`<span class="lbl">${t(other==='line'?'otherLine':'otherDot')}</span><div class="mv">${svgMol(S.L,S.b,S.lp,{mode:other,pad:20})}</div><div class="legend">${t('legend')}</div>`;
}
function fbList(issues){
  const L=S.L,out=[];
  for(const is of issues){
    if(is.k==='disc')out.push(t('fbDisc',{a:atomLabel(L,is.a)}));
    else if(is.k==='over')out.push(t('fbOver',{n:is.n,t:is.t}));
    else if(is.k==='under')out.push(t('fbUnder',{n:is.n}));
    else if(is.k==='atom')out.push(t('fbAtom',{a:atomLabel(L,is.a),t:is.t,n:is.n}));
    else if(is.k==='fc')out.push(t('fbFC'));
  }
  const uniq=[...new Set(out)];return uniq.slice(0,4);
}
function renderTask(){
  const L=S.L,el=$('#task');let h='';
  const noteBox=S.step>1?`<div class="note"><span class="lbl">${t('learned')}</span>${tx(L.note)}</div>`:'';
  if(S.step===1){
    h=`<h3>${t('buildTitle',{f:fH(L.f)})}</h3><span class="lbl">${t('method')}</span><ol class="method">
      <li>${t('m1')}</li><li>${t(L.diatomic?'m2d':'m2')}</li><li>${t('m3')}</li>${L.diatomic?'':`<li>${t('m4')}</li>`}<li>${t(L.diatomic?'m5d':'m5')}</li></ol>`;
    h+=S.hint?`<div class="fb info"><span class="t">${t('hintLbl')}:</span> ${tx(L.hint)}</div>`:`<button class="linkbtn" type="button" id="hintBtn">${t('showHint')}</button>`;
    if(S.fb)h+=`<div class="fb bad"><span class="t">${t('fbNotYet')}</span><ul>${S.fb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    if(S.fails>=2)h+=`<div class="row-btns"><button class="btn" type="button" id="ansBtn">${t('showAns')}</button></div>`;
  }else if(S.step===2){
    h=`<div class="fb ok">${S.ans?t('ansUsed'):t('fbOk')}</div>${noteBox}`;
    if(L.diatomic){
      h+=`<h3 style="margin-top:14px">${t('pairTitle')}</h3><div class="counter"><span>${t('pairLbl')}</span>${ctl('domX',S.domX)}</div>`;
    }else{
      h+=`<h3 style="margin-top:14px">${t('domTitle',{a:L.atoms[0].e})}</h3>
       <div class="counter"><span>${t('domX')}</span>${ctl('domX',S.domX)}</div>
       <div class="counter"><span>${t('domE')}</span>${ctl('domE',S.domE)}</div>
       <div class="axe-out">${axeHTML(S.domX,S.domE)}</div><p class="small" style="margin:0">${t('domTip')}</p>`;
    }
    if(S.msg)h+=`<div class="fb bad">${S.msg}</div>`;
    h+=`<div class="row-btns"><button class="btn primary" type="button" id="domSubmit">${t('submit')}</button></div>`;
  }else if(S.step===3){
    h=domSummary()+`<h3 style="margin-top:14px">${t('shapeTitle',{f:fH(L.f)})}</h3><p class="small" style="margin:0">${L.diatomic?t('shapeTipD'):t('shapeTip')}</p>
     <div class="opts">${S.shapeOpts.map(k=>{const s=SHAPES[k],w=S.shapeWrong.includes(k);return `<button class="opt ${w?'wrong':''}" type="button" data-shape="${k}" ${w?'disabled':''}><canvas data-thumb="${k}"></canvas><span class="on">${lang==='th'?s.th:s.en}</span><span class="oe">${lang==='th'?s.en:s.th}</span></button>`}).join('')}</div>`;
    if(S.msg)h+=`<div class="fb bad">${S.msg}</div>`;
  }else if(S.step===4){
    const sh=SHAPES[L.shape];
    h=`<div class="fb ok">${t('shapeOk',{f:fH(L.f),s:tx(sh)})}</div><h3 style="margin-top:14px">${L.diatomic?t('bondTitle',{f:fH(L.f)}):t('angTitle',{f:fH(L.f)})}</h3>
     <div class="opts">${S.angOpts.map(o=>{const w=S.angWrong.includes(o.k);return `<button class="opt txt ${w?'wrong':''}" type="button" data-ang="${o.k}" ${w?'disabled':''}>${esc(o.label||tx(o.o))}</button>`}).join('')}</div>`;
    if(S.msg)h+=`<div class="fb bad">${S.msg}</div>`;
  }else{
    const p=progress[L.id],st=starsFor(total());
    const stt=stats(),allDone=stt.n===16;
    h=`<span class="eyebrow">${t('doneTitle',{n:S.i+1})}</span><p class="praise">${tx(PRAISE[S.i])}</p>
     ${allDone?`<div class="finale"><b>${t('finale')}</b><span class="small">${t('finaleSub')}</span><div class="row-btns"><button class="btn primary" type="button" id="grandBtn2">${t('certAll')}</button></div></div>`:`<p class="small" style="margin:0 0 6px">${t('remain',{n:stt.n,k:16-stt.n})}</p>`}
     <div class="bigstars" aria-label="${st}/3">${[0,1,2].map(i=>i<st?'★':'<span class="off">★</span>').join('')}</div>
     <div class="score-break"><span>${t('pBuild')}</span><b>${S.pts.build}/50</b><span>${t(L.diatomic?'pDomD':'pDom')}</span><b>${S.pts.dom}/20</b><span>${t('pShape')}</span><b>${S.pts.shape}/20</b><span>${t(L.diatomic?'pAngD':'pAng')}</span><b>${S.pts.ang}/10</b><span class="tot">${t('total')}</span><b class="tot">${total()}/100</b></div>
     ${p&&p.score>total()?`<p class="small">${t('best',{s:p.score})}</p>`:''}${noteBox}
     <div class="row-btns"><button class="btn primary" type="button" id="certBtn">${t('getCert')}</button>${S.i<15?`<button class="btn dark" type="button" id="nextBtn">${t('next')} →</button>`:''}<button class="btn" type="button" id="replayBtn">${t('replay')}</button></div>`;
  }
  el.innerHTML=h;
  if(S.step===3)requestAnimationFrame(()=>$$('#task canvas[data-thumb]').forEach(cv=>draw3D(cv,genericModel(cv.dataset.thumb),.55,.32)));
}
function domSummary(){const L=S.L;if(L.diatomic){const n=S.b[0];return `<div class="fb ok">${t('pairOk',{n,e:n*2})}</div>`}
  const X=L.atoms.length-1,E=S.lp[0],d=X+E;return `<div class="fb ok">${t('domOk',{axe:axeHTML(X,E),d,g:tx(GEOM[d])})}</div>`}
function ctl(id,v){return `<span class="ctl"><button type="button" data-dec="${id}" aria-label="−">−</button><output>${v}</output><button type="button" data-inc="${id}" aria-label="+">+</button></span>`}
const starsFor=s=>s>=90?3:s>=70?2:1;
function render3DLab(){
  const L=S.L,sh=SHAPES[L.shape];
  if(L.diatomic){$('#threeLab').innerHTML=`<span class="big">${fH(L.f)} · ${tx(sh)}</span><span class="mono">180°</span>`;return}
  const X=L.atoms.length-1,E=S.lp[0];
  $('#threeLab').innerHTML=`<span class="big">${fH(L.f)} · ${tx(sh)}</span><span class="mono">${axeHTML(X,E)} · ${t('angle')} ${tx(L.ang.opts[L.ang.ans])}</span><span>${t('geom')}: ${tx(GEOM[sh.d])}</span>${E?`<span class="leg">${t('lpLegend')}</span>`:''}`;
}

/* ---------- play events ---------- */
function snapshot(){S.hist.push({b:S.b.slice(),lp:S.lp.slice()});if(S.hist.length>60)S.hist.shift()}
function changed(){S.marks=null;renderBoard();renderBudget();renderChips();renderMini();$('#undoBtn').disabled=!S.hist.length}
function act(target){
  if(!S||S.step!==1)return;
  const gb=target.closest('[data-bond]'),ga=target.closest('[data-atom]');
  if(gb){const k=+gb.dataset.bond;snapshot();S.b[k]=S.mode==='add'?(S.b[k]+1)%4:Math.max(0,S.b[k]-1);S.pop='b'+k;changed();focusBack('[data-bond="'+k+'"]')}
  else if(ga){const i=+ga.dataset.atom;snapshot();S.lp[i]=S.mode==='add'?(S.lp[i]+1)%5:Math.max(0,S.lp[i]-1);S.pop='a'+i;changed();focusBack('[data-atom="'+i+'"]')}
}
let kbAct=false;
function focusBack(sel){if(kbAct){const el=$('#board '+sel);if(el)el.focus()}kbAct=false}
$('#board').addEventListener('click',e=>act(e.target));
$('#board').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();kbAct=true;act(e.target)}});
$('#chips').addEventListener('pointerover',e=>{const c=e.target.closest('[data-hl]');const v=c?+c.dataset.hl:-1;if(v!==S.hl){S.hl=v;renderBoard()}});
$('#chips').addEventListener('pointerleave',()=>{if(S.hl!==-1){S.hl=-1;renderBoard()}});
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;S.mode=b.dataset.mode;renderPlay()});
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;renderPlay()});
$('#tabSeg').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b||b.disabled)return;S.tab=b.dataset.tab;renderPlay()});
$('#undoBtn').onclick=()=>{const h=S.hist.pop();if(!h)return;S.b=h.b;S.lp=h.lp;changed()};
$('#resetBtn').onclick=()=>{snapshot();S.b=S.b.map(()=>0);S.lp=S.lp.map(()=>0);S.fb=null;changed();renderTask()};
$('#fillBtn').onclick=()=>{snapshot();const L=S.L;L.atoms.forEach((a,i)=>{if(i===0&&!L.diatomic)return;if(a.e==='H')return;S.lp[i]=Math.max(0,(a.t-2*bondSum(L,S.b,i))/2)});changed()};
$('#checkBtn').onclick=()=>{
  const r=validate(S.L,S.b,S.lp);
  S.marks={};S.L.atoms.forEach((_,i)=>S.marks[i]=r.bad.has(i)?'bad':'ok');
  if(r.ok){S.fb=null;S.step=2;S.marks=null;S.domX=0;S.domE=0;renderPlay()}
  else{S.fails++;S.pts.build=Math.max(20,50-10*S.fails);S.fb=fbList(r.issues);renderPlay()}
};
$('#task').addEventListener('click',e=>{
  const L=S.L,tg=e.target;
  if(tg.closest('#hintBtn')){S.hint=true;renderTask();return}
  if(tg.closest('#ansBtn')){S.b=L.sol.b.slice();S.lp=L.sol.lp.slice();S.ans=true;S.pts.build=15;S.fb=null;S.marks=null;S.step=2;renderPlay();return}
  const inc=tg.closest('[data-inc]'),dec=tg.closest('[data-dec]');
  if(inc||dec){const k=(inc||dec).dataset[inc?'inc':'dec'];S[k]=Math.max(0,Math.min(8,S[k]+(inc?1:-1)));S.msg=null;renderTask();return}
  if(tg.closest('#domSubmit')){
    const ok=L.diatomic?S.domX===S.b[0]:(S.domX===L.atoms.length-1&&S.domE===S.lp[0]);
    if(ok){S.step=3;S.msg=null}else{S.domWrong++;S.pts.dom=Math.max(5,20-5*S.domWrong);S.msg=t('tryAgain')}
    renderPlay();return}
  const so=tg.closest('[data-shape]');
  if(so){const k=so.dataset.shape;if(k===L.shape){S.step=4;S.msg=null;S.tab='3d'}else{S.shapeWrong.push(k);S.pts.shape=Math.max(5,20-7*S.shapeWrong.length);S.msg=t('tryAgain')}renderPlay();return}
  const ao=tg.closest('[data-ang]');
  if(ao){const k=+ao.dataset.ang,ans=L.diatomic?L.bt:L.ang.ans;if(k===ans){S.msg=null;finish()}else{S.angWrong.push(k);S.pts.ang=Math.max(0,10-5*S.angWrong.length);S.msg=t('tryAgain');renderPlay()}return}
  if(tg.closest('#certBtn')){openCert(S.i);return}
  if(tg.closest('#grandBtn2')){openCert('all');return}
  if(tg.closest('#nextBtn')){startLevel(S.i+1);return}
  if(tg.closest('#replayBtn')){startLevel(S.i);return}
});
function finish(){
  S.step=5;const sc=total(),L=S.L,prev=progress[L.id];
  if(!prev||sc>=prev.score)progress[L.id]={score:sc,stars:starsFor(sc),date:new Date().toISOString(),sol:{b:S.b.slice(),lp:S.lp.slice()}};
  store.set('progress',progress);renderPlay();celebrate(stats().n===16);
}
function celebrate(big){

$('#arFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  if(AR.photoURL)URL.revokeObjectURL(AR.photoURL);AR.photoURL=URL.createObjectURL(f);
  const im=$('#arPhoto');im.onload=()=>arSetSource('photo');im.src=AR.photoURL;e.target.value=''});

/* tilt: the molecule keeps its place in the room while the phone turns around it */
function arOri(e){if(e.alpha==null&&e.beta==null)return;AR.gyroSeen=true;AR.g={a:e.alpha||0,b:e.beta||0};if(!AR.g0)AR.g0={...AR.g}}
async function arGyroStart(){
  AR.g=AR.g0=null;AR.gyroSeen=false;clearTimeout(AR.gyroTimer);
  const DOE=window.DeviceOrientationEvent;
  if(!DOE){AR.gyro=false;arGyroLabel();return false}
  try{if(typeof DOE.requestPermission==='function'){const r=await DOE.requestPermission();if(r!=='granted'){AR.gyro=false;arGyroLabel();return false}}}catch(e){AR.gyro=false;arGyroLabel();return false}
  window.addEventListener('deviceorientation',arOri);AR.gyro=true;arGyroLabel();
  AR.gyroTimer=setTimeout(()=>{if(!AR.gyroSeen){window.removeEventListener('deviceorientation',arOri);AR.gyro=false;arGyroLabel()}},1600);
  return true;
}
function arGyroStop(){window.removeEventListener('deviceorientation',arOri);clearTimeout(AR.gyroTimer);AR.gyro=false;AR.g=AR.g0=null;arGyroLabel()}
$('#arGyro').onclick=async()=>{
  if(AR.gyro){arGyroStop();return}
  await arGyroStart();
  setTimeout(()=>{if(!AR.gyroSeen&&AR.on){arStatus(t('arGyroNA'));setTimeout(()=>arStatus(null),2600)}},1700);
};
function arPose(){
  let yaw=AR.yaw,pitch=AR.pitch,ox=0,oy=0;
  if(AR.gyro&&AR.g&&AR.g0){
    let da=AR.g.a-AR.g0.a;da=((da+540)%360)-180;const db=clampN(AR.g.b-AR.g0.b,-70,70);
    yaw+=da*Math.PI/180;pitch=clampN(pitch+db*Math.PI/180*.8,-1.45,1.45);
    const W=innerWidth,H=innerHeight;ox=clampN(da*3.2,-W*.3,W*.3);oy=clampN(db*3.2,-H*.25,H*.25);
  }
  return {yaw,pitch,ox,oy};
}
function arGround(ctx,cx,cy,unit,dpr,ts){
  const gy=cy+unit*1.5,rx=unit*1.55,ry=unit*.34;
  ctx.save();ctx.translate(cx,gy);ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,1,0,0,rx);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(.6,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.setLineDash([unit*.16,unit*.1]);ctx.lineDashOffset=reduced?0:-(ts||0)*.03;
  ctx.strokeStyle='rgba(255,182,39,.9)';ctx.lineWidth=2.2*dpr;ctx.beginPath();ctx.ellipse(cx,gy,rx*.78,ry*.78,0,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);ctx.strokeStyle='rgba(255,210,122,.35)';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.ellipse(cx,gy,rx*.52,ry*.52,0,0,Math.PI*2);ctx.stroke();ctx.restore();
}
function arFrame(ts,dt){
  if(!AR.model||!$('#arSheet').hidden)return;
  const live=AR.gyro&&AR.gyroSeen;
  if(!AR.drag&&!AR.pinch&&!live&&!reduced&&ts-AR.idle>2500)AR.yaw+=dt*.00045;
  const p=arPose(),lift=-innerHeight*.07;
  draw3D($('#arCv'),AR.model,p.yaw,p.pitch,{zoom:AR.zoom,ox:p.ox,oy:p.oy+lift,pre:(ctx,cx,cy,u,dpr)=>arGround(ctx,cx,cy,u,dpr,ts)});
}
/* drag to rotate, pinch or wheel to zoom */
const arCv=$('#arCv');
function arDist(){const v=[...AR.ptr.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1}
arCv.addEventListener('pointerdown',e=>{AR.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});try{arCv.setPointerCapture(e.pointerId)}catch(_){}
  if(AR.ptr.size===1){AR.drag={x:e.clientX,y:e.clientY,yaw:AR.yaw,pitch:AR.pitch};arCv.style.cursor='grabbing'}
  else if(AR.ptr.size===2){AR.drag=null;AR.pinch={d:arDist(),z:AR.zoom}}});
arCv.addEventListener('pointermove',e=>{if(!AR.ptr.has(e.pointerId))return;AR.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(AR.pinch&&AR.ptr.size>=2){AR.zoom=clampN(AR.pinch.z*arDist()/AR.pinch.d,.5,2.8);return}
  if(AR.drag){AR.yaw=AR.drag.yaw+(e.clientX-AR.drag.x)*.01;AR.pitch=clampN(AR.drag.pitch+(e.clientY-AR.drag.y)*.01,-1.4,1.4)}});
const arUp=e=>{AR.ptr.delete(e.pointerId);
  if(AR.ptr.size<2)AR.pinch=null;
  if(AR.ptr.size===1){const v=[...AR.ptr.values()][0];AR.drag={x:v.x,y:v.y,yaw:AR.yaw,pitch:AR.pitch}}
  if(AR.ptr.size===0){AR.drag=null;AR.idle=performance.now();arCv.style.cursor=''}};
arCv.addEventListener('pointerup',arUp);arCv.addEventListener('pointercancel',arUp);
arCv.addEventListener('wheel',e=>{e.preventDefault();AR.zoom=clampN(AR.zoom*Math.exp(-e.deltaY*.0015),.5,2.8);AR.idle=performance.now()},{passive:false});

/* capture: camera frame + molecule + a caption band the student can hand in */
function coverDraw(ctx,src,sw,sh,W,H){const k=Math.max(W/sw,H/sh),dw=sw*k,dh=sh*k;ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh)}
function arCapture(){
  const cv=$('#arCv'),W=cv.width,H=cv.height;if(!W||!H)return;
  const out=document.createElement('canvas');out.width=W;out.height=H;const ctx=out.getContext('2d');
  const v=$('#arVid'),im=$('#arPhoto');
  ctx.fillStyle='#141D25';ctx.fillRect(0,0,W,H);
  if(AR.src==='cam'&&AR.stream&&v.videoWidth)coverDraw(ctx,v,v.videoWidth,v.videoHeight,W,H);
  else if(AR.src==='photo'&&im.naturalWidth)coverDraw(ctx,im,im.naturalWidth,im.naturalHeight,W,H);
  else{ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;const g=Math.round(28*W/innerWidth);for(let x=0;x<W;x+=g){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke()}for(let y=0;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke()}}
  ctx.drawImage(cv,0,0);
  const a=arInfo(AR.list[AR.i]),s=W/innerWidth,bandH=Math.round(150*s);
  const gr=ctx.createLinearGradient(0,H-bandH*1.4,0,H);gr.addColorStop(0,'rgba(4,7,10,0)');gr.addColorStop(.35,'rgba(4,7,10,.72)');gr.addColorStop(1,'rgba(4,7,10,.9)');
  ctx.fillStyle=gr;ctx.fillRect(0,H-bandH*1.4,W,bandH*1.4);
  const mw=W-32*s;
  drawSegs(ctx,a.f?[{f:a.f},{t:'  '+a.sub}]:[{t:a.title}],W/2,H-bandH+40*s,30*s,FF.disp,700,'#FFFFFF',mw);
  fitText(ctx,`${a.shape}${a.axeT?' · '+a.axeT:''} · ${t('angle')} ${a.ang}`,W/2,H-bandH+76*s,18*s,FF.body,600,'#FFC85C',mw);
  const who=[cfg.student,cfg.klass].filter(Boolean).join(' · ');
  fitText(ctx,(who?who+'  ·  ':'')+t('arFooter')+'  ·  '+fmtDate(),W/2,H-bandH+108*s,14*s,FF.body,500,'#C6D2DB',mw);
  AR.shot={cv:out,name:`ar-${a.file}.png`};
  $('#arShotImg').src=out.toDataURL('image/png');$('#arShotImg').alt=t('arShotTitle',{f:a.f?fU(a.f):a.title});
  $('#arShotTitle').textContent=t('arShotTitle',{f:a.f?fU(a.f):a.title});
  $('#arSheet').hidden=false;$('#arSave').focus();
}
$('#arShot').onclick=arCapture;
$('#arSave').onclick=async()=>{if(!AR.shot)return;const blob=await new Promise(r=>AR.shot.cv.toBlob(r,'image/png'));if(blob)saveBlob(AR.shot.name,blob)};
$('#arBack').onclick=()=>{$('#arSheet').hidden=true;$('#arShot').focus()};
$('#arSrcBtn').onclick=()=>arChoose(false);
$('#arReset').onclick=()=>{AR.yaw=.6;AR.pitch=.3;AR.zoom=1.05;if(AR.g)AR.g0={...AR.g};AR.idle=0};
$('#arPrev').onclick=()=>{if(AR.i>0){AR.i--;arRenderInfo()}};
$('#arNext').onclick=()=>{if(AR.i<AR.list.length-1){AR.i++;arRenderInfo()}};
$('#arClose').onclick=()=>$('#ar').close();
$('#ar').addEventListener('close',()=>{AR.on=false;AR.token++;arStop();arStatus(null);arGyroStop();$('#arSheet').hidden=true;$('#arMsg').hidden=true});
$('#arLvBtn').onclick=()=>{if(S)openAR(arCleared(S.i),S.i)};
$('#arHomeBtn').onclick=()=>{const l=arCleared(-1);if(l.length)openAR(l,l[0].i);else openAR(SC.map(i=>({kind:'lv',i})),SC[0])};
$('#vtable').addEventListener('click',e=>{const b=e.target.closest('[data-arshape]');if(b)openAR(Object.keys(SHAPES).map(k=>({kind:'sh',k})),b.dataset.arshape)});

/* ---------- boot ---------- */
applyStatic();renderHome();renderShowcase();
addViewer($('#scCv'),()=>scModel,()=>!$('#home').hidden);
addViewer($('#cv3'),()=>S&&S.step>=4?levelModel(S.L,{b:S.b,lp:S.lp}):null,()=>S&&S.tab==='3d'&&!$('#play').hidden);
if(!reduced)setInterval(()=>{if(!$('#home').hidden){scI=(scI+1)%SC.length;renderShowcase()}},5000);
requestAnimationFrame(loop);
document.fonts&&document.fonts.ready.then(()=>{if(!$('#home').hidden)renderVTable()});
</script>

(function(){

let box=null,lastFocus=null,curSpec=null;

/* ---------- engine adapter (เกมหลัก 5 เกม และจากพันธะสู่รูปร่าง) ---------- */
function engine(id){
  const cfg=GAMES[id],LG=()=>lang,R=o=>o==null?'':typeof o==='string'?o:(LG()==='en'?o.en:o.th);
  const isB2S=id==='bond-to-shape';
  const Ls=()=>isB2S?LEVELS:window.GAME.levels,CHs=()=>isB2S?CHAPTERS:window.GAME.chapters;
  const idx=lid=>Ls().findIndex(l=>l.id===lid);
  const lf=L=>/^[?0-9.\u2013\s-]+$/.test(String(L.f))?esc2(tx(L.name)):fH(L.f);
  const lab=lid=>{const i=idx(lid);return i<0?lid:`${i+1}. ${lf(Ls()[i])}`};
  const labs=a=>a.map(lab).join(', ');
  const ot=o=>typeof optTxt==='function'?optTxt(o):(o&&o.f?fH(o.f):esc2(tx(o)));
  function spec(){
    const H=TGuide.H,Lv=Ls(),CH=CHs(),N=Lv.length;
    const byCh=CH.map((c,ci)=>Lv.map((L,i)=>[L,i]).filter(([L])=>L.ch===ci));
    const chRows=byCh.map((ls,ci)=>[`${R(UI.thCh)} ${ci+1}`,esc2(tx(CH[ci])),ls.map(([L,i])=>`${i+1}. ${lf(L)}`).join(' · '),R(cfg.book[ci])]);
    const first=byCh.map(ls=>ls[0]).filter(Boolean),rest=byCh.map(ls=>ls.slice(1));
    const pa=rest.flatMap(ls=>ls.filter((_,k)=>k%2===0)),pb=rest.flatMap(ls=>ls.filter((_,k)=>k%2===1));
    const lv=a=>a.map(([L,i])=>`${i+1}. ${lf(L)}`).join(', ');
    const stRows=cfg.stages.map(([s,ids,how])=>{const sl=s.includes('|')?s.split('|')[LG()==='en'?1:0]:s;
      const lvs=ids==='auto'?`<b>${R(UI.allPairs)}:</b> ${lv(first)}<br><b>${R(UI.pairA)}:</b> ${lv(pa)}<br><b>${R(UI.pairB)}:</b> ${lv(pb)}`:labs(ids);return [sl,lvs,R(how)]});
    const misRows=cfg.mis.map(([m,ids,ev])=>[R(m),labs(ids).split(', ').join('<br>'),R(ev)]);
    const maxAll=N*100;
    const score=isB2S?{rows:[
        [R(T('สร้างโครงสร้างลิวอิส','Lewis structure')),'50',R(T('กดตรวจแล้วยังไม่ถูกหักครั้งละ 10 ต่ำสุด 20 · ถ้ากดดูเฉลยได้ 15','Each failed check costs 10, minimum 20 · Show answer gives 15'))],
        [R(T('นับกลุ่มอิเล็กตรอน (AXE)','Electron domains (AXE)')),'20',R(T('ตอบผิดหักครั้งละ 5 ต่ำสุด 5','Each wrong answer costs 5, minimum 5'))],
        [R(T('เลือกรูปร่าง','Choose the shape')),'20',R(T('ตอบผิดหักครั้งละ 7 ต่ำสุด 5','Each wrong answer costs 7, minimum 5'))],
        [R(T('มุมพันธะหรือชนิดพันธะ','Bond angle or bond type')),'10',R(T('ตอบผิดหักครั้งละ 5 ต่ำสุด 0','Each wrong answer costs 5, minimum 0'))],
        [R(T('ทั้งด่าน','Whole level')),'100',R(ENGINE_SCORE.rows[2][2])]],notes:ENGINE_SCORE.notes}:ENGINE_SCORE;
    const ar=isB2S?[T('ด่านที่ผ่านแล้วดูแบบจำลองสามมิติในห้อง AR ได้ ลากเพื่อหมุน ถ่างสองนิ้วเพื่อย่อขยาย และเอียงเครื่องเพื่อมองจากมุมอื่น','Passed levels can be viewed as 3D models in the AR room: drag to rotate, pinch to zoom, tilt to look from another angle'),...ENGINE_AR.slice(1)]:ENGINE_AR;
    return {
      eyebrow:`${R(UI.eyebrow)} · ${esc2(t('appName'))}`,title:R(UI.title),printLbl:R(UI.print),closeLbl:R(UI.close),navLbl:R(UI.nav),
      sections:[
        {nav:R(UI.n1),h:R(UI.h1),html:H.list([`<b>${R(UI.useWith)}</b> ${R(cfg.plan)}`,`<b>${R(UI.role)}</b> ${R(cfg.role)}`,`<b>${R(UI.size)}</b> ${R(T(`${N} ด่าน ${CH.length} บท คะแนนเต็ม ${maxAll.toLocaleString()} คะแนน (ด่านละ 100)`,`${N} levels in ${CH.length} chapters, ${maxAll.toLocaleString()} points in total (100 per level)`))} · ${R(cfg.time)}`,`<b>${R(UI.flow)}</b> ${R(cfg.flow)}`])},
        {nav:R(UI.n2),h:R(UI.h2),html:H.table([R(UI.thCh),R(UI.thChName),R(UI.thLv),R(UI.thBook)],chRows,[0])+H.note(R(LO))},
        {nav:R(UI.n3),h:R(UI.h3),html:H.table([R(UI.thStage),R(UI.thLv),R(UI.thUse)],stRows,[0])+H.note(R(SUGGEST))},
        {nav:R(UI.n4),h:R(UI.h4),html:H.table([R(UI.thMis),R(UI.thLv),R(UI.thEv)],misRows,[1])},
        {nav:R(UI.n6),h:R(UI.h6),html:H.table([R(UI.thStep),R(UI.thPts),R(UI.thRule)],score.rows.map(r=>r.map(c=>R(c))),[1])+H.list(score.notes.map(R))},
        {nav:R(UI.n7),h:R(UI.h7),html:H.list([...ar.map(R),...cfg.prep.map(R)])}],
      credit:R(CREDIT)};
  }
  function label(){const m=document.getElementById('tgMount');if(!m)return;m.querySelector('[data-tg="h"]').textContent=R(UI.mountH);m.querySelector('[data-tg="p"]').textContent=R(cfg.plan);const b=m.querySelector('#tgBtn');b.textContent=R(UI.mountBtn)}
  function boot(){
    const b=document.getElementById('tgBtn');if(b)b.addEventListener('click',()=>TGuide.open(spec()));
    label();
    if(typeof applyStatic==='function'){const _a=applyStatic;applyStatic=function(){const r=_a.apply(this,arguments);label();if(TGuide.isOpen())TGuide.open(spec());return r}}
  }
  return {boot,spec,label};
}
function esc2(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
